<!DOCTYPE html>

<title>Shred Session 2</title>
<style>
  :root{--y:#ffd21a;--r:#e8261c;--ink:#0b0b10;--w:#fff}
  html,body{margin:0;height:100%;overflow:hidden;background:#101014;color:var(--w);
    font-family:"Arial Black","Arial Bold",Impact,Haettenschweiler,sans-serif}
  canvas{display:block}
  .o{text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 6px rgba(0,0,0,.6)}
  #hud{position:fixed;inset:0;pointer-events:none;display:none}
  #score{position:absolute;left:24px;top:14px;font-size:34px;font-style:italic;color:var(--w)}
  #scoreLbl{font-size:13px;color:var(--y);letter-spacing:2px}
  #spec{position:absolute;left:24px;top:70px;width:220px;height:12px;border:2px solid #000;background:#2a2a2a;transform:skewX(-20deg)}
  #specFill{height:100%;width:0;background:linear-gradient(90deg,#1d7cff,#35e0ff)}
  #spec.full #specFill{background:linear-gradient(90deg,#ffb400,#fff26b);animation:pulse .4s infinite alternate}
  @keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.6)}}
  #timer{position:absolute;right:26px;top:12px;font-size:40px;font-style:italic}
  #timer.low{color:var(--r)}
  #letters{position:absolute;right:26px;top:66px;font-size:22px;letter-spacing:6px;font-style:italic}
  #letters span{color:#555}#letters span.got{color:var(--y)}
  #tapeIco{position:absolute;right:26px;top:98px;font-size:13px;color:#888}
  #tapeIco.got{color:#7cff6b}
  #combo{position:absolute;left:0;right:0;bottom:92px;text-align:center;font-style:italic}
  #comboTricks{font-size:18px;color:var(--w);max-width:80vw;margin:0 auto;line-height:1.25}
  #comboPts{font-size:30px;color:var(--y)}
  #comboPts.fail{color:var(--r)}
  #bank{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-size:44px;font-style:italic;color:var(--y);opacity:0;transition:opacity .3s}
  #toast{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:26px;font-style:italic;color:var(--y);opacity:0;transition:opacity .25s}
  #balH{position:absolute;left:50%;top:58%;width:220px;height:10px;margin-left:-110px;background:linear-gradient(90deg,#e8261c,#ffd21a 30%,#3cff6b 45%,#3cff6b 55%,#ffd21a 70%,#e8261c);border:2px solid #000;display:none}
  #balV{position:absolute;left:62%;top:35%;width:10px;height:180px;background:linear-gradient(0deg,#e8261c,#ffd21a 30%,#3cff6b 45%,#3cff6b 55%,#ffd21a 70%,#e8261c);border:2px solid #000;display:none}
  .needle{position:absolute;background:#fff;border:1px solid #000}
  #balH .needle{top:-6px;width:4px;height:18px;left:50%}
  #balV .needle{left:-6px;height:4px;width:18px;top:50%}

  #goalsMini{position:absolute;left:24px;top:98px;font-family:Verdana,Arial,sans-serif;font-size:11px;line-height:1.55;color:#ccc}
  #goalsMini .d{color:#7cff6b;text-decoration:line-through}
  #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,0,0,.25),rgba(0,0,0,.75))}
  .panel{min-width:420px;max-width:92vw;max-height:92vh;overflow:auto;padding:22px 30px;background:rgba(10,10,16,.82);border:3px solid var(--y);transform:skewX(-4deg);box-shadow:8px 8px 0 #000}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

  .card.sel{border-color:var(--y);background:#2b2020}
  .card .nm{font-style:italic;font-size:15px}
  .card .st{font-family:Verdana,Arial,sans-serif;font-size:10px;color:#aaa}
  .sw{display:inline-block;width:10px;height:10px;border:1px solid #000;margin-right:2px;vertical-align:middle}
  .stats{font-family:Verdana,Arial,sans-serif;font-size:12px;margin-top:10px}
  .stats .row{display:flex;align-items:center;gap:8px;margin:3px 0}
  .stats .row span{width:80px;color:#ccc}
  .bar{flex:1;height:10px;background:#333;border:1px solid #000}
  .bar i{display:block;height:100%;background:var(--y)}
  .lv{display:flex;gap:10px}
  .lvc{flex:1;min-width:200px;padding:10px;background:#1b1b24;border:2px solid #000;cursor:pointer}
  .lvc.sel{border-color:var(--y)}
  .lvc.lock{opacity:.5}
  .lvc h3{margin:0 0 6px;font-style:italic;color:var(--y)}
  .gl{font-family:Verdana,Arial,sans-serif;font-size:11px;line-height:1.6;color:#ccc}
  .gl .d{color:#7cff6b}
  .note{font-family:Verdana,Arial,sans-serif;font-size:12px;color:#bbb;line-height:1.6}
  .note b{color:var(--y)}
  table.keys{font-family:Verdana,Arial,sans-serif;font-size:12px;border-collapse:collapse}
  table.keys td{padding:3px 10px 3px 0;vertical-align:top}
  table.keys td:first-child{color:var(--y);white-space:nowrap}

  #tests .p{color:#6f6}#tests .f{color:#f66}
  #fps{position:fixed;left:4px;bottom:4px;font:11px monospace;color:#8f8;display:none}

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   SHRED SESSION 2 — a THPS2-style skateboarding game in one file.
   Physics is analytic (no mesh raycasts): every collider exposes
   heightAt(x,z) -> hit record {y, n, s, u}. ground() takes the HIGHEST
   hit at or below a height limit. Vertical velocity is always tracked
   explicitly (S.v.y in air, tangent * speed on surfaces) — never dy/dt.
   ===================================================================== */

const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');

// ---------- tuning ----------
const DT = 1 / 120;          // fixed physics step
const G = 24;                // gravity (m/s^2) — arcade-heavy
const RAMP_G = 0.62;         // gravity scale along curved transitions (pumpy vert)
const STEP_UP = 0.34;        // curb height you roll onto without an ollie
const AIR_STEP = 0.3;        // ledge-catch tolerance while airborne
const SNAP = 0.28;           // max drop that keeps you glued to the ground (no slope launches)
const RAD = 0.3;             // skater collision radius
const BODY_H = 1.6;
const RUN_TIME = 120;
const VERT_U = 0.02;         // vert airs stay locked this far inside the coping
const UP = Object.freeze({ x: 0, y: 1, z: 0 });

// ---------- small vector kit (plain objects, physics side) ----------
const v3 = (x = 0, y = 0, z = 0) => ({ x, y, z });
const vadd = (a, b) => v3(a.x + b.x, a.y + b.y, a.z + b.z);
const vsub = (a, b) => v3(a.x - b.x, a.y - b.y, a.z - b.z);
const vsc = (a, s) => v3(a.x * s, a.y * s, a.z * s);
const vdot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const vcross = (a, b) => v3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
const vlen = a => Math.hypot(a.x, a.y, a.z);
const vnorm = a => { const l = vlen(a) || 1; return v3(a.x / l, a.y / l, a.z / l); };
const vproj = (a, n) => vsub(a, vsc(n, vdot(a, n)));          // project onto plane with normal n
const yawVec = y => v3(Math.sin(y), 0, Math.cos(y));
const yawOf = v => Math.atan2(v.x, v.z);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wrapA = a => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };
const fmt = n => Math.round(n).toLocaleString('en-US');
function mulberry(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let rnd = mulberry(1234);

/* =====================================================================
   DATA: skaters, tricks, specials
   ===================================================================== */
// stats 1..10: air, hang(time), ollie, speed, spin, balance
const SKATERS = [
  { name: 'Rio Vance',      style: 'Vert',   stance: 'Regular', st: [8, 7, 5, 6, 7, 5], c: [0xd8342b, 0x2b3a67, 0xc68c5a, 0x2a1a0e, 0xeeeeee, 0xffcc00], sp: ['Kickflip Underflip', 'Christ Air', 'Darkslide'] },
  { name: 'Kenji Mori',     style: 'Street', stance: 'Goofy',   st: [4, 5, 8, 7, 6, 8], c: [0x1f1f1f, 0x6b6b6b, 0xe0b48a, 0x101010, 0xd02020, 0x33c3ff], sp: ['Hardflip Late Flip', 'Rocket Air', 'Hang Ten Nosegrind'] },
  { name: 'Dee Castillo',   style: 'All-Round', stance: 'Regular', st: [6, 6, 6, 6, 7, 6], c: [0x2e9e4f, 0x1c1c2a, 0x8d5a3b, 0x1a0d05, 0xffffff, 0xff6a00], sp: ['Casper Flip', 'Judo Madonna', 'Salad Grind'] },

  { name: 'Wes Calder',     style: 'Street', stance: 'Regular', st: [4, 4, 9, 8, 5, 7], c: [0x3355aa, 0x8a7a5a, 0xe6b98f, 0x503020, 0xdddddd, 0xee2222], sp: ['Kickflip Underflip', 'Rocket Air', 'Nosegrind to Pivot'] },
  { name: 'Lina Sokolova',  style: 'Vert',   stance: 'Goofy',   st: [8, 9, 4, 5, 7, 5], c: [0x6a1b9a, 0x111111, 0xf6dcc6, 0xb0171f, 0xffffff, 0xffe000], sp: ['Hardflip Late Flip', 'Kickflip McTwist', 'Salad Grind'] },
  { name: 'Pax Adeyemi',    style: 'All-Round', stance: 'Regular', st: [6, 7, 6, 7, 7, 5], c: [0x00897b, 0xcfcfcf, 0x4a2c1a, 0x080808, 0xff5500, 0xffffff], sp: ['Casper Flip', 'Christ Air', 'Hang Ten Nosegrind'] },
  { name: "Gus 'Rat' Ferreira", style: 'Street', stance: 'Goofy', st: [5, 5, 8, 9, 5, 6], c: [0x444444, 0x1a3a6a, 0xd9a877, 0x222222, 0x77ff00, 0xff00aa], sp: ['Fingerflip Airwalk', 'Judo Madonna', 'Nosegrind to Pivot'] },
];
const STAT_NAMES = ['Air', 'Hangtime', 'Ollie', 'Speed', 'Spin', 'Balance'];

// Direction keys: '' none, U D L R and diagonals UL UR DL DR (read at the moment you press the button)
// anim: board rotation in full turns — roll (long axis), yaw (shove), pitch (impossible)
const FLIPS = {
  '':   { name: 'Kickflip',        pts: 100, dur: 0.40, anim: { roll: 1 } },
  'L':  { name: 'Heelflip',        pts: 100, dur: 0.40, anim: { roll: -1 } },
  'R':  { name: 'Impossible',      pts: 200, dur: 0.48, anim: { pitch: 1 } },
  'U':  { name: 'Pop Shove-It',    pts: 100, dur: 0.34, anim: { yaw: 0.5 } },
  'D':  { name: '360 Shove-It',    pts: 200, dur: 0.44, anim: { yaw: 1 } },
  'UL': { name: 'Varial Heelflip', pts: 300, dur: 0.50, anim: { roll: -1, yaw: -0.5 } },
  'UR': { name: 'Varial Kickflip', pts: 300, dur: 0.50, anim: { roll: 1, yaw: 0.5 } },
  'DL': { name: 'Hardflip',        pts: 300, dur: 0.50, anim: { roll: 1, pitch: 0.5, yaw: -0.5 } },
  'DR': { name: '360 Flip',        pts: 400, dur: 0.54, anim: { roll: 1, yaw: 1 } },
};
// tweak: body/board pose hints for the renderer
const GRABS = {
  '':   { name: 'Method',     pts: 250, hold: 120, tw: { board: [0.5, 0, 0.35], hand: 'back', leg: 0 } },
  'U':  { name: 'Nosegrab',   pts: 150, hold: 100, tw: { board: [-0.45, 0, 0], hand: 'front', leg: 0 } },
  'D':  { name: 'Tailgrab',   pts: 150, hold: 100, tw: { board: [0.45, 0, 0], hand: 'back', leg: 0 } },
  'L':  { name: 'Melon',      pts: 200, hold: 110, tw: { board: [0, 0, -0.35], hand: 'front', leg: 0 } },
  'R':  { name: 'Indy',       pts: 200, hold: 110, tw: { board: [0, 0, 0.35], hand: 'back', leg: 0 } },
  'UL': { name: 'Madonna',    pts: 400, hold: 150, tw: { board: [-0.7, 0, 0.2], hand: 'front', leg: 1 } },
  'UR': { name: 'Benihana',   pts: 400, hold: 150, tw: { board: [0.7, 0, -0.2], hand: 'none', leg: -1 } },
  'DL': { name: 'Stalefish',  pts: 300, hold: 130, tw: { board: [0.2, 0, 0.5], hand: 'back', leg: 0 } },
  'DR': { name: 'Japan',      pts: 300, hold: 130, tw: { board: [-0.3, 0.6, 0], hand: 'front', leg: 0 } },
};
// pose: board yaw on the rail (0 = along, 1 = across), pitch (+ tail down), yaw tweak
const GRINDS = {
  '':   { name: '50-50 Grind',    pts: 100, rate: 90,  pose: { across: 0, pitch: 0, yaw: 0 } },
  'U':  { name: '5-0 Grind',      pts: 100, rate: 90,  pose: { across: 0, pitch: 0.28, yaw: 0 } },
  'D':  { name: 'Nosegrind',      pts: 100, rate: 90,  pose: { across: 0, pitch: -0.28, yaw: 0 } },
  'L':  { name: 'Boardslide',     pts: 150, rate: 100, pose: { across: 1, pitch: 0, yaw: 0 } },
  'R':  { name: 'Lipslide',       pts: 150, rate: 100, pose: { across: 1, pitch: 0, yaw: Math.PI } },
  'UL': { name: 'Smith Grind',    pts: 200, rate: 110, pose: { across: 0, pitch: 0.2, yaw: -0.3 } },
  'UR': { name: 'Feeble Grind',   pts: 200, rate: 110, pose: { across: 0, pitch: 0.2, yaw: 0.3 } },
  'DL': { name: 'Crooked Grind',  pts: 200, rate: 110, pose: { across: 0, pitch: -0.2, yaw: 0.35 } },
  'DR': { name: 'Overcrook',      pts: 250, rate: 120, pose: { across: 0, pitch: -0.2, yaw: -0.35 } },
};
// Lip tricks: press GRIND at the top of a vert ramp. invert = handstand family
const LIPS = {
  '':   { name: 'Axle Stall',      pts: 200, rate: 150, pose: 'stall' },
  'U':  { name: 'Nose Stall',      pts: 200, rate: 150, pose: 'nose' },
  'D':  { name: 'Blunt to Fakie',  pts: 250, rate: 160, pose: 'blunt', fakie: true },
  'L':  { name: 'Invert',          pts: 400, rate: 220, pose: 'invert' },
  'R':  { name: 'Handplant',       pts: 400, rate: 220, pose: 'invert' },
  'UL': { name: 'Rock to Fakie',   pts: 250, rate: 160, pose: 'rock', fakie: true },
  'UR': { name: 'One Foot Invert', pts: 500, rate: 250, pose: 'invert' },
  'DL': { name: 'Disaster',        pts: 250, rate: 160, pose: 'rock' },
  'DR': { name: 'Eggplant',        pts: 500, rate: 250, pose: 'invert' },
};
const MANUALS = { manual: { name: 'Manual', pts: 50, rate: 70 }, nose: { name: 'Nose Manual', pts: 75, rate: 80 } };
const REVERT = { name: 'Revert', pts: 100 };
// Specials: need a full special meter. Tap the two arrows in order, then the button.
const SPECIALS = {
  'Kickflip Underflip': { btn: 'flip', seq: 'LR', pts: 1100, dur: 0.75, anim: { roll: 2 } },
  'Hardflip Late Flip': { btn: 'flip', seq: 'RL', pts: 1200, dur: 0.80, anim: { roll: 2, pitch: 0.5, yaw: -0.5 } },
  'Casper Flip':        { btn: 'flip', seq: 'UD', pts: 1000, dur: 0.75, anim: { roll: 1, pitch: 1 } },
  'Fingerflip Airwalk': { btn: 'flip', seq: 'DU', pts: 1150, dur: 0.80, anim: { roll: 1, yaw: 1 } },
  'Christ Air':         { btn: 'grab', seq: 'LR', pts: 1400, hold: 250, tw: { board: [0, 0, 0.9], hand: 'front', leg: 0, christ: 1 } },
  'Judo Madonna':       { btn: 'grab', seq: 'RL', pts: 1300, hold: 240, tw: { board: [-0.8, 0, 0.3], hand: 'front', leg: 1 } },
  'Rocket Air':         { btn: 'grab', seq: 'UD', pts: 1200, hold: 230, tw: { board: [-1.2, 0, 0], hand: 'front', leg: 0 } },
  'Kickflip McTwist':   { btn: 'grab', seq: 'DU', pts: 1600, hold: 260, tw: { board: [0.3, 0, 0.4], hand: 'back', leg: 0 } },
  'Darkslide':          { btn: 'grind', seq: 'LR', pts: 900, rate: 250, pose: { across: 1, pitch: 0, yaw: 0, roll: Math.PI } },
  'Hang Ten Nosegrind': { btn: 'grind', seq: 'RL', pts: 850, rate: 240, pose: { across: 0, pitch: -0.5, yaw: 0 } },
  'Salad Grind':        { btn: 'grind', seq: 'UD', pts: 800, rate: 230, pose: { across: 0, pitch: 0.25, yaw: 0.45 } },
  'Nosegrind to Pivot': { btn: 'grind', seq: 'DU', pts: 850, rate: 240, pose: { across: 0.5, pitch: -0.3, yaw: 0 } },
};
const DEGRADE = [1, 0.75, 0.5, 0.25, 0.1];

// skater-derived tuning
function statsOf(i) {
  const [air, hang, ollie, speed, spin, bal] = SKATERS[i].st;
  const maxSpd = 11.5 + speed * 0.45;
  return {
    maxSpd, cruise: maxSpd * 0.72, pushAcc: 5 + speed * 0.35, turn: 2.9,
    ollieV: 5.7 + ollie * 0.2, hangG: 1.08 - hang * 0.025, airBoost: 0.94 + air * 0.02,
    spinRate: (330 + spin * 33) * Math.PI / 180, flipSpeed: 0.85 + spin * 0.03, instab: 1.25 - bal * 0.055,
  };
}

/* =====================================================================
   COLLIDERS — each returns a hit record {y, n, s, u} from heightAt()
   ===================================================================== */
class Floor {
  constructor(y = 0) { this.kind = 'floor'; this.y = y; this.holes = []; }
  heightAt(x, z) {
    for (const h of this.holes) { const dx = x - h.cx, dz = z - h.cz; if (dx * dx + dz * dz < h.r * h.r) return null; }

    shape.lineTo(R, 0); shape.lineTo(0, 0);
    for (const sgn of [-1, 1]) {
      const sg = new THREE.ShapeGeometry(shape), P = sg.attributes.position;
      for (let i = 0; i < P.count; i++) { const u = P.getX(i), yy = P.getY(i); P.setXYZ(i, x + d.x * u + lat.x * half * sgn, y0 + yy, z + d.z * u + lat.z * half * sgn); }
      sg.computeVertexNormals(); this.mesh(sg, MAT[o.side || 'paint']).material.side = THREE.DoubleSide;
    }
    // coping + deck
    const cp = v3(x + d.x * R, y0 + R, z + d.z * R);
    const cyl = new THREE.CylinderGeometry(0.07, 0.07, len, 10); cyl.rotateZ(Math.PI / 2); cyl.rotateY(ang); cyl.translate(cp.x, cp.y, cp.z); this.mesh(cyl, MAT.steel);
    if (deck > 0) this.box(x + d.x * (R + deck / 2), z + d.z * (R + deck / 2), len, deck, y0 + R, { rot: ang, mat: o.deckMat || 'wood' });
    this.rail([v3(cp.x - lat.x * half, cp.y, cp.z - lat.z * half), v3(cp.x + lat.x * half, cp.y, cp.z + lat.z * half)], { kind: 'coping', vis: false, surf: q });
    return q;
  }
  bowl(cx, cz, r0, R, o = {}) {
    const y0 = -R, b = new Bowl({ cx, cz, r0, R, y0 });
    W.surfaces.push(b); W.arcs.push(b); W.floor.holes.push({ cx, cz, r: r0 + R });
    const pts = []; const N = 16;
    for (let i = 0; i <= N; i++) { const th = Math.PI / 2 * i / N; pts.push(new THREE.Vector2(r0 + R * Math.sin(th), y0 + R * (1 - Math.cos(th)))); }
    const lg = new THREE.LatheGeometry(pts, 64); lg.translate(cx, 0, cz);
    const P = lg.attributes.position, uv = new Float32Array(P.count * 2);
    for (let i = 0; i < P.count; i++) { const a = Math.atan2(P.getX(i) - cx, P.getZ(i) - cz); uv[i * 2] = a * (r0 + R) / 3; uv[i * 2 + 1] = P.getY(i) / 2; }
    lg.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); lg.userData.noUV = true;
    this.mesh(lg, MAT.rampC);
    const fl = new THREE.CircleGeometry(r0 + 0.01, 48); fl.rotateX(-Math.PI / 2); fl.translate(cx, y0, cz); this.mesh(fl, MAT.concrete);
    const tor = new THREE.TorusGeometry(r0 + R, 0.07, 6, 72); tor.rotateX(Math.PI / 2); tor.translate(cx, y0 + R, cz); tor.userData.noUV = true; this.mesh(tor, MAT.steel);
    const ring = []; for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2; ring.push(v3(cx + Math.sin(a) * (r0 + R), y0 + R, cz + Math.cos(a) * (r0 + R))); }
    this.rail(ring, { kind: 'coping', closed: true, vis: false, surf: b });
    return b;
  }
  rail(pts, o = {}) {
    const r = { pts, closed: !!o.closed, kind: o.kind || 'rail', surf: o.surf || null, segs: railSegs(pts, !!o.closed) };
    W.rails.push(r);
    if (o.vis !== false) {
      const rad = o.vis === 'edge' ? 0.035 : 0.045;
      for (const s of r.segs) {
        const cy = new THREE.CylinderGeometry(rad, rad, s.len, 8); cy.userData.noUV = true;
        const m = this.mesh(cy, MAT.steel); m.position.set((s.a.x + s.b.x) / 2, (s.a.y + s.b.y) / 2, (s.a.z + s.b.z) / 2);
        m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(s.dir.x, s.dir.y, s.dir.z));
      }
      if (o.vis !== 'edge' && o.posts !== false) {
        const posts = [];
        for (const s of r.segs) { const n = Math.max(1, Math.round(s.len / 2.5)); for (let i = 0; i <= n; i++) posts.push(vadd(s.a, vsc(vsub(s.b, s.a), i / n))); }

          const g0 = ground(p.x, p.z, p.y - 0.1); const gy = g0 ? g0.y : 0; const h = p.y - gy; if (h < 0.1) continue;
          const cy = new THREE.CylinderGeometry(0.035, 0.035, h, 6); cy.translate(p.x, gy + h / 2, p.z); cy.userData.noUV = true; this.mesh(cy, MAT.steel);

    return r;
  }
  letter(ch, x, y, z) { W.letters.push({ ch, p: v3(x, y, z), got: false, obj: null }); }
  tape(x, y, z) { W.tape = { p: v3(x, y, z), got: false, obj: null }; }
  smash(type, x, z) { W.props.push({ type, x, z, r: 0.55, h: type === 'crate' ? 1 : 1.1, alive: true, obj: null }); }
  gap(name, pts, A, B, both = false) { W.gaps.push({ name, pts, A, B, both }); }
  spawn(x, z, yaw) { W.spawn = { x, z, yaw }; }
  deco(geo, mat) { return this.mesh(geo, mat); }
  bounds(x0, x1, z0, z1, h, mat) {
    W.bounds = [x0, x1, z0, z1];
    this.block(x0 - 2, x0, z0 - 2, z1 + 2, h, { mat }); this.block(x1, x1 + 2, z0 - 2, z1 + 2, h, { mat });

  }
  floorMesh(mat) {
    const [x0, x1, z0, z1] = W.bounds;
    const sh = new THREE.Shape(); sh.moveTo(x0, -z0); sh.lineTo(x1, -z0); sh.lineTo(x1, -z1); sh.lineTo(x0, -z1); sh.lineTo(x0, -z0);
    for (const h of W.floor.holes) { const p = new THREE.Path(); p.absarc(h.cx, -h.cz, h.r, 0, Math.PI * 2, true); sh.holes.push(p); }

}

/* =====================================================================
   INPUT (sim-side). Keyboard/gamepad push events; the sim latches them
   once per fixed step so edges are deterministic.
   ===================================================================== */
const SPECIAL_FULL = 0.98;
const DIR_ACTIONS = { up: 'U', down: 'D', left: 'L', right: 'R' };
const IN = { held: {}, pend: [], down: {}, up: {}, taps: [] };
function inputEvent(a, on) { IN.pend.push([a, !!on]); }
function latchInput() {
  IN.down = {}; IN.up = {};
  for (const [a, on] of IN.pend) {
    if (on && !IN.held[a]) {
      IN.down[a] = true;
      if (DIR_ACTIONS[a]) {
        IN.taps.push({ k: DIR_ACTIONS[a], t: W.t });
        if (IN.taps.length > 6) IN.taps.shift();
        const n = IN.taps.length;
        if (n >= 2 && IN.taps[n - 1].t - IN.taps[n - 2].t < 0.3) {          // ↑↓ manual, ↓↑ nose manual
          const s = IN.taps[n - 2].k + IN.taps[n - 1].k;
          if (s === 'UD' || s === 'DU') { S.manualBuf = W.t; S.manualNose = s === 'DU'; }
        }
      }
    }
    if (!on && IN.held[a]) IN.up[a] = true;
    IN.held[a] = on;
  }
  IN.pend.length = 0;
}
function dirKey() {
  const h = IN.held, u = h.up && !h.down, d = h.down && !h.up, l = h.left && !h.right, r = h.right && !h.left;
  return (u ? 'U' : d ? 'D' : '') + (l ? 'L' : r ? 'R' : '');
}
function specialFor(btn) {
  if (S.special < SPECIAL_FULL || IN.taps.length < 2) return null;
  const a = IN.taps[IN.taps.length - 2], b = IN.taps[IN.taps.length - 1];
  if (W.t - b.t > 0.5 || b.t - a.t > 0.45) return null;
  const seq = a.k + b.k;
  for (const nm of SKATERS[S.idx].sp) { const sp = SPECIALS[nm]; if (sp.btn === btn && sp.seq === seq) { IN.taps.length = 0; S.manualBuf = -9; return nm; } }
  return null;
}

/* =====================================================================
   COMBO & SCORING
   ===================================================================== */

    let ok = false;
    if (g.type === 'score') ok = R.score >= g.target;
    else if (g.type === 'skate') ok = R.letters.size >= 5;
    else if (g.type === 'tape') ok = R.tape;
    else if (g.type === 'smash') ok = R.smashed >= g.count;
    else if (g.type === 'gap') ok = R.gaps.has(g.gap);

/* =====================================================================
   ONE FIXED STEP
   ===================================================================== */
function simStep(dt) {
  latchInput();
  W.t += dt;
  if (GS.state !== 'play') return;
  const D = IN.down;
  if (D.grind) S.grindBuf = W.t;
  if (D.manual) { S.manualBuf = W.t; S.manualNose = !!IN.held.down; }
  // --- actions that depend on the current mode
  switch (S.mode) {
    case 'flat': case 'arc':
      if (S.manual && D.ollie) { S.crouchT = 0; doOllie(); break; }
      if (D.ollie) { S.charging = true; S.crouchT = 0; }
      if (S.charging) { S.crouchT += dt; if (!IN.held.ollie) { if (S.mode === 'flat' || S.arc.th < 1.0) doOllie(); else S.charging = false; break; } }
      if (D.revert && S.revertWin > 0 && !S.manual) doRevert();
      if (D.grind && S.mode === 'flat' && tryGrind(true)) break;
      if (S.mode === 'flat' && !S.manual && W.t - S.manualBuf < 0.12) startManual(S.manualNose);
      break;
    case 'air':
      if (D.flip) startFlip();
      if (D.grab) startGrab();
      if (D.ollie) { S.charging = true; S.crouchT = 0.2; }
      if (IN.up.ollie) {                                   // late ollie right after rolling off an edge
        if (S.air.from === 'ground' && !S.air.ollie && S.air.t < 0.1) { S.v.y = Math.max(S.v.y, 0) + S.K.ollieV; S.air.ollie = true; hooks.sfx('pop'); }
        S.charging = false;
      }
      break;
    case 'grind': if (D.ollie) { endGrind('ollie'); break; } if (D.grind) switchGrind(); break;
    case 'lip': if (D.ollie) lipDrop(false); break;
  }
  // --- physics
  switch (S.mode) {
    case 'flat': stepFlat(dt); break;
    case 'arc': stepArc(dt); break;
    case 'air': stepAir(dt); break;
    case 'grind': stepGrind(dt); break;
    case 'lip': stepLip(dt); break;
    case 'bail': stepBail(dt); break;
  }
  if (!isFinite(S.p.x + S.p.y + S.p.z)) respawn();
  // --- combo resolution: grounded & not linking -> bank it
  if (C.list.length && (S.mode === 'flat' || S.mode === 'arc') && !S.manual) {
    if (!(C.graceFlat && S.mode === 'arc')) C.grace -= dt;
    if (C.grace <= 0) comboBank();
  }
  S.revertWin = Math.max(0, S.revertWin - dt);
  S.special = Math.max(0, S.special - 0.01 * dt);
  for (const k in S.fx) S.fx[k] = Math.max(0, S.fx[k] - dt * 3);
  stepCollect();
  // --- run clock
  if (R && !R.over && !GS.free) {
    R.time -= dt;
    if (R.time <= 0 && !R.timeUp) { R.time = 0; R.timeUp = true; hooks.toast("TIME'S UP!"); }
    if (R.timeUp) {
      R.timeUpT += dt;
      const neutral = (S.mode === 'flat' || S.mode === 'arc') && !S.manual && !C.list.length;
      if (neutral || R.timeUpT > 10) endRun();
    }
  }
}

    const h = ground(0, 0, 5); if (!('y' in h) || !h.n || !h.s) return 'hit record missing y/n/s';
    return true;
  });
  T('air landing compares hit.y against next-y (no tunnelling at -150 m/s)', () => {
    fresh(0); api.tp(-18, 8, -11.5, { air: true, vy: -150 });
    landed(1);
    return (S.mode === 'flat' && near(S.p.y, 1.6, 1e-6)) || `ended ${S.mode} at y=${f2(S.p.y)}`;
  });
  T('flat rolling: vy tracked explicitly, stays exactly on the floor', () => {
    fresh(0); api.tp(28, null, 38, { yaw: Math.PI, speed: 14 });
    for (let i = 0; i < 240; i++) { simStep(DT); if (S.mode !== 'flat') return 'left the ground: ' + S.mode; if (Math.abs(S.v.y) > 1e-9 || Math.abs(S.p.y) > 1e-9) return 'vy/y drift ' + S.v.y; }
    return true;
  });
  T('School roof bank: 17° bank crest does not auto-launch', () => {
    fresh(1); api.tp(-22, null, -12, { yaw: Math.PI, speed: 14 }); hold('up');
    let air = false; const ok = until(() => { if (S.mode !== 'flat') air = true; return S.p.z < -37; }, 6); hold('up', false);
    return (!air && ok && near(S.p.y, 5.5, 1e-6)) || `air=${air} reached=${ok} y=${f2(S.p.y)}`;
  });
  T('Warehouse funbox pyramid at full speed stays grounded', () => {
    fresh(0); api.tp(8, null, 20, { yaw: Math.PI, speed: 14 });
    let air = false, top = 0; until(() => { if (S.mode !== 'flat') air = true; top = Math.max(top, S.p.y); return S.p.z < 4; }, 3);
    return (!air && near(top, 1.0, 1e-6)) || `air=${air} top=${f2(top)}`;
  });
  T('Channel bank crest onto the platform stays grounded', () => {
    fresh(0); api.tp(-18, null, 0, { yaw: Math.PI, speed: 13 });
    let air = false; until(() => { if (S.mode !== 'flat') air = true; return S.p.z < -13.5; }, 3);
    return (!air && near(S.p.y, 1.6, 1e-6)) || `air=${air} y=${f2(S.p.y)} z=${f2(S.p.z)}`;
  });
  T('Rolling down the roof-B bank stays glued', () => {
    fresh(1); api.tp(30, null, -40, { yaw: 0, speed: 8 });
    if (!near(S.p.y, 4.8, 1e-6)) return 'not on roof B';
    let air = false; until(() => { if (S.mode !== 'flat') air = true; return S.p.z > -15; }, 4);
    return (!air && near(S.p.y, 0, 1e-6)) || `air=${air} y=${f2(S.p.y)}`;
  });
  T('Kicker lip is a real launch (explicit vy > 0, no ollie)', () => {
    fresh(0); api.tp(0, null, 30, { yaw: Math.PI, speed: 13 });
    const ok = until(() => S.mode === 'air', 1.5);
    return (ok && S.v.y > 1 && S.p.z < 20.3 && S.p.z > 19.5 && !S.air.ollie) || `air=${ok} vy=${f2(S.v.y)} z=${f2(S.p.z)}`;
  });
  T('Ollie pops 0.6–1.6 m and lands', () => {
    fresh(0); api.tp(28, null, 30, { yaw: Math.PI, speed: 10 }); tap('ollie'); steps(1);
    if (S.mode !== 'air') return 'no ollie';
    let top = 0; landed(2); top = S.maxY;
    return (S.mode === 'flat' && top > 0.6 && top < 1.6) || `mode=${S.mode} top=${f2(top)}`;
  });
  T('Vert: launches straight up and drops back INTO the halfpipe', () => {
    fresh(0); api.tp(0, null, -32, { yaw: Math.PI / 2, speed: 13 });
    let vert = false, top = 0, bail = false, deck = false, launches = 0, wasVert = false;
    until(() => { if (S.mode === 'air' && S.vert) { if (!wasVert) launches++; vert = true; } wasVert = S.mode === 'air' && !!S.vert; top = Math.max(top, S.p.y); if (S.mode === 'bail') bail = true; if (Math.abs(S.p.x) > 7.45 && S.p.y > 3.3) deck = true; return false; }, 6);
    return (vert && launches >= 2 && top > 4.4 && !bail && !deck && Math.abs(S.p.x) <= 7.4) || `vert=${vert} launches=${launches} top=${f2(top)} bail=${bail} deck=${deck} x=${f2(S.p.x)}`;
  });
  T('Bowl: 8 s of carving never escapes the bowl or bails', () => {
    fresh(2); api.tp(0, null, -8, { yaw: 0.6, speed: 12 });
    let maxR = 0, bail = false, air = 0;
    until(() => { maxR = Math.max(maxR, Math.hypot(S.p.x, S.p.z + 8)); if (S.mode === 'bail') bail = true; if (S.vert) air++; return false; }, 8);
    return (maxR <= 7.71 && !bail && air > 0) || `maxR=${f2(maxR)} bail=${bail} vertSteps=${air}`;
  });
  T('Kickflip lands clean and scores exactly 100', () => {
    fresh(0); api.tp(28, null, 30, { yaw: Math.PI, speed: 10 }); const s0 = R.score;
    tap('ollie'); steps(3); tap('flip'); landed(2); steps(60);
    return (S.mode === 'flat' && R.score - s0 === 100 && hooks.lastBank && hooks.lastBank.n === 1) || `mode=${S.mode} delta=${R.score - s0}`;
  });
  T('Landing mid-flip = bail', () => {
    fresh(0); api.tp(28, 0.25, 30, { air: true, vz: -8, yaw: Math.PI }); tap('flip'); landed(1);
    return S.mode === 'bail' || 'mode ' + S.mode;
  });
  T('Landing sideways = bail; backwards = clean fakie', () => {
    fresh(0); api.tp(28, 1.5, 30, { air: true, vz: -8, yaw: Math.PI / 2 }); landed(1);
    if (S.mode !== 'bail') return 'sideways did not bail: ' + S.mode;
    fresh(0); api.tp(28, 1.5, 30, { air: true, vz: -8, yaw: 0 }); landed(1);
    return (S.mode === 'flat' && S.fakie) || `fakie landing -> ${S.mode} fakie=${S.fakie}`;
  });
  T('Grind: snap to rail, 50-50, ride to the end and pop off', () => {
    fresh(0); S.balLock = true; api.tp(-6, 1.3, 17, { air: true, vz: -8, yaw: Math.PI }); hold('grind');
    if (!until(() => S.mode === 'grind', 0.5)) return 'never snapped';
    if (S.grind.name !== '50-50 Grind') return 'got ' + S.grind.name;
    hold('grind', false);
    if (!until(() => S.mode !== 'grind', 4)) return 'grind never ended';
    const endMode = S.mode; landed(2); until(() => hooks.lastBank, 1);
    return (endMode === 'air' && hooks.lastBank && R.score > 0) || `end=${endMode} bank=${JSON.stringify(hooks.lastBank)}`;
  });
  T('Grind modifiers: ↙ = Crooked, switch to ↑ = 5-0', () => {
    fresh(0); S.balLock = true; api.tp(-6, 1.3, 17, { air: true, vz: -8, yaw: Math.PI }); hold('down'); hold('left'); hold('grind');
    if (!until(() => S.mode === 'grind', 0.5)) return 'never snapped';
    const n1 = S.grind.name; hold('grind', false); hold('down', false); hold('left', false); steps(2); hold('up'); tap('grind'); steps(1); hold('up', false);
    const n2 = S.grind && S.grind.name;
    return (n1 === 'Crooked Grind' && n2 === '5-0 Grind' && C.list.length === 2) || `${n1} -> ${n2}`;
  });
  T('Grind balance runs out with no input (bowl coping loop)', () => {
    fresh(2); api.tp(0, 0.4, -0.3, { air: true, vx: 6, yaw: Math.PI / 2 }); hold('grind');
    if (!until(() => S.mode === 'grind', 0.5)) return 'no coping snap';
    hold('grind', false); const t0 = W.t;
    const b = until(() => S.mode === 'bail', 25);
    return (b && W.t - t0 > 0.5) || `bailed=${b} after ${f2(W.t - t0)}s`;
  });
  T('Manual links a combo: Kickflip + Manual + Heelflip = x3', () => {
    fresh(0); S.balLock = true; api.tp(28, null, 34, { yaw: Math.PI, speed: 11 });
    tap('ollie'); steps(3); tap('flip'); hold('manual'); landed(2);
    if (!S.manual) return 'no manual on landing (' + S.mode + ')';
    hold('manual', false); steps(40); hold('left'); tap('ollie'); steps(3); tap('flip'); steps(1); hold('left', false);
    landed(2); until(() => hooks.lastBank, 1.5);
    return (hooks.lastBank && hooks.lastBank.n === 3) || 'bank ' + JSON.stringify(hooks.lastBank);
  });
  T('Nose manual via ↓↑ taps', () => {
    fresh(0); S.balLock = true; api.tp(28, null, 30, { yaw: Math.PI, speed: 10 }); tap('down'); steps(2); tap('up'); steps(2);
    return (S.manual && S.manual.nose) || 'manual=' + (S.manual && S.manual.def.name);
  });
  T('Revert after a vert air keeps the combo alive (Method + Revert = x2)', () => {
    fresh(0); api.tp(0, null, -32, { yaw: Math.PI / 2, speed: 13 });
    if (!until(() => S.mode === 'air' && S.vert, 3)) return 'no vert air';
    tap('grab'); landed(3);
    if (S.mode !== 'arc') return 'landed in ' + S.mode;
    tap('revert'); steps(1);
    if (!C.list.some(e => e.name === 'Revert')) return 'no revert in combo';
    until(() => hooks.lastBank, 4);
    return (hooks.lastBank && hooks.lastBank.n === 2) || 'bank ' + JSON.stringify(hooks.lastBank);
  });
  T('Lip trick: → + grind at the lip = Handplant, drops back in', () => {
    fresh(0); S.balLock = true; api.tp(0, null, -32, { yaw: Math.PI / 2, speed: 12 });
    if (!until(() => S.mode === 'arc' && S.arc.th > 1.15 && S.arc.vs > 0, 2)) return 'never high on the ramp';
    hold('right'); hold('grind'); steps(1); hold('right', false);
    if (!until(() => S.mode === 'lip', 1)) return 'no lip (mode ' + S.mode + ')';
    const nm = S.lip.name; steps(100); hold('grind', false);
    until(() => hooks.lastBank, 3);
    return (nm === 'Handplant' && hooks.lastBank && S.mode !== 'bail') || `${nm} bank=${JSON.stringify(hooks.lastBank)}`;
  });
  T('Downtown pro trick: Handplant in the bowl completes the goal', () => {
    fresh(2); S.balLock = true; api.tp(0, null, -8, { yaw: 0, speed: 12 });
    if (!until(() => S.mode === 'arc' && S.arc.th > 1.15 && S.arc.vs > 0, 2)) return 'never high in the bowl';
    hold('right'); hold('grind'); steps(1); hold('right', false);
    if (!until(() => S.mode === 'lip', 1)) return 'no lip';
    steps(60); hold('grind', false); until(() => hooks.lastBank, 3);
    return R.goals.has('pro') || 'goal not set';
  });
  T('Warehouse pro trick: 360 Flip to Manual', () => {
    fresh(0); S.balLock = true; api.tp(28, null, 36, { yaw: Math.PI, speed: 11 });
    hold('ollie'); steps(36); hold('ollie', false); steps(2); hold('down'); hold('right'); tap('flip'); steps(1); hold('down', false); hold('right', false);
    hold('manual'); landed(2); if (!S.manual) return 'no manual after 360 flip: ' + S.mode + ' ' + JSON.stringify(C.list.map(e => e.name));
    hold('manual', false); steps(30); tap('ollie'); landed(2); until(() => hooks.lastBank, 1.5);
    return R.goals.has('pro') || 'combo ' + JSON.stringify(hooks.lastBank);
  });
  T('S-K-A-T-E letters, secret tape and 5 smashes complete their goals', () => {
    fresh(0);
    for (const L of W.letters) { airAt(L.p.x, L.p.y - 0.9, L.p.z); steps(1); }
    airAt(W.tape.p.x, W.tape.p.y - 0.9, W.tape.p.z); steps(1);
    for (const pr of W.props) { api.tp(pr.x, null, pr.z + 1.6, { yaw: Math.PI, speed: 5 }); until(() => !pr.alive, 1); }
    return (R.goals.has('skate') && R.goals.has('tape') && R.goals.has('smash') && R.smashed === 5) || `goals=${[...R.goals]} smashed=${R.smashed}`;
  });
  T('Channel Gap is detected (platform A -> B)', () => {
    fresh(0); api.tp(-18, null, -12.2, { yaw: Math.PI, speed: 13 }); tap('ollie'); landed(2); steps(60);
    return (R.gaps.has('Channel Gap') && R.goals.has('gap')) || `gaps=${[...R.gaps]} landed y=${f2(S.p.y)} z=${f2(S.p.z)} ${S.mode}`;
  });
  T('Walls: skating into a 1.6 m platform face does not pass through', () => {
    fresh(0); api.tp(-8, null, -11, { yaw: -Math.PI / 2, speed: 10 });
    let minX = 99; until(() => { minX = Math.min(minX, S.p.x); return false; }, 1);
    return (minX >= -12 + RAD - 1e-3 && S.p.y < 0.01) || `minX=${f2(minX)} y=${f2(S.p.y)}`;
  });
  T('Special: meter full + ← → + flip = skater special', () => {
    fresh(0); S.special = 1; api.tp(28, null, 30, { yaw: Math.PI, speed: 10 }); tap('ollie'); steps(2); tap('left'); steps(2); tap('right'); steps(1); tap('flip'); steps(1);
    return (S.air && S.air.tricks[0] && S.air.tricks[0].name === SKATERS[0].sp[0]) || JSON.stringify(S.air && S.air.tricks);
  });
  T('Tap flip twice mid-flip = Double Kickflip', () => {
    fresh(0); airAt(28, 6, 30, { vz: -5, yaw: Math.PI }); tap('flip'); steps(5); tap('flip'); steps(1);
    return (S.air.tricks.length === 1 && S.air.tricks[0].name === 'Double Kickflip') || JSON.stringify(S.air.tricks);
  });
  T('Spin 360 + grab = "BS 360 Method"', () => {
    fresh(0); airAt(28, 4, 30, { vz: -8, vy: 5, yaw: Math.PI }); tap('grab'); steps(1); hold('left');
    until(() => Math.abs(S.air.spin) >= Math.PI * 2 - 0.02, 1.2); hold('left', false);
    landed(2); until(() => hooks.lastBank || S.mode === 'bail', 1.5);
    return (hooks.lastBank && hooks.lastBank.names[0] === 'BS 360 Method') || (S.mode + ' ' + JSON.stringify(hooks.lastBank));
  });
  T('setT(): timer expiry ends the run', () => {
    fresh(0); api.setT(0.05); const ok = until(() => GS.state === 'end', 12);
    return (ok && R.over) || 'state ' + GS.state;
  });
  T('12 skaters with six 1-10 stats and 3 specials each', () => {
    if (SKATERS.length !== 12) return 'count ' + SKATERS.length;
    for (const s of SKATERS) { if (s.st.length !== 6 || s.st.some(v => v < 1 || v > 10)) return s.name + ' stats'; if (s.sp.length !== 3 || s.sp.some(n => !SPECIALS[n])) return s.name + ' specials'; }
    return true;
  });
  T('3 levels with S-K-A-T-E, tape, 5 smashables and all goal types', () => {
    if (LEVELS.length !== 3) return 'levels ' + LEVELS.length;
    for (let i = 0; i < 3; i++) {
      fresh(i); const lv = LEVELS[i];
      if (W.letters.map(l => l.ch).join('') !== 'SKATE') return lv.id + ' letters';
      if (!W.tape) return lv.id + ' tape'; if (W.props.length < 5) return lv.id + ' props';
      for (const t of ['score', 'skate', 'tape', 'smash', 'pro', 'gap']) if (!lv.goals.some(g => g.type === t)) return lv.id + ' missing goal ' + t;
      for (const g of lv.goals) if (g.type === 'gap' && !W.gaps.some(x => x.name === g.gap)) return lv.id + ' unknown gap ' + g.gap;
      if (!W.arcs.length || !W.rails.length) return lv.id + ' needs ramps + rails';
      for (const L of W.letters.concat([W.tape])) { const g = ground(L.p.x, L.p.z, L.p.y); if (!g || L.p.y - g.y < 0.3) return lv.id + ' item buried at ' + JSON.stringify(L.p); }
    }
    return true;
  });
  T('Trick vocabulary is complete', () => {
    const all = new Set([...Object.values(FLIPS), ...Object.values(GRABS), ...Object.values(GRINDS), ...Object.values(LIPS), ...Object.values(MANUALS), REVERT].map(t => t.name).concat(['Ollie']));
    const need = ['Ollie', 'Kickflip', 'Heelflip', 'Pop Shove-It', '360 Shove-It', '360 Flip', 'Varial Kickflip', 'Hardflip', 'Impossible', 'Indy', 'Melon', 'Method', 'Stalefish', 'Madonna', 'Benihana', '50-50 Grind', '5-0 Grind', 'Nosegrind', 'Boardslide', 'Lipslide', 'Smith Grind', 'Feeble Grind', 'Crooked Grind', 'Axle Stall', 'Blunt to Fakie', 'Invert', 'Handplant', 'Manual', 'Nose Manual', 'Revert'];
    const miss = need.filter(n => !all.has(n));
    return !miss.length || 'missing ' + miss.join(', ');
  });
  T('Stress: 60 s of random input stays in bounds with finite state', () => {
    for (let lv = 0; lv < 3; lv++) {
      fresh(lv); const r = mulberry(lv + 5), acts = ['up', 'down', 'left', 'right', 'ollie', 'flip', 'grab', 'grind', 'manual', 'revert'];
      const [x0, x1, z0, z1] = W.bounds;
      for (let i = 0; i < 60 * 120; i++) {
        if (i % 20 === 0) { const a = acts[(r() * acts.length) | 0]; inputEvent(a, r() < 0.5); }
        simStep(DT);
        if (!isFinite(S.p.x + S.p.y + S.p.z + S.v.x + S.v.y + S.v.z)) return LEVELS[lv].id + ' NaN at step ' + i;
        if (S.p.x < x0 - 0.01 || S.p.x > x1 + 0.01 || S.p.z < z0 - 0.01 || S.p.z > z1 + 0.01 || S.p.y < -4) return `${LEVELS[lv].id} out of bounds ${f2(S.p.x)},${f2(S.p.y)},${f2(S.p.z)} mode=${S.mode}`;
      }
      for (const a of acts) inputEvent(a, false); steps(1);
    }
    return true;
  });

  // restore everything the tests touched
  career = JSON.parse(savedCareer); try { if (savedLS == null) localStorage.removeItem(CAREER_KEY); else localStorage.setItem(CAREER_KEY, savedLS); } catch (e) { }
  for (const a in IN.held) IN.held[a] = false; IN.pend.length = 0;
  R = null; GS.state = 'title'; loadLevel(0); setSkater(0); paintSkater(0); placeSkater(W.spawn.x, W.spawn.z, W.spawn.yaw);
  api.debug.testResults = res;
  return res;
}

/* =====================================================================
   BOOT
   ===================================================================== */
loadLevel(0); setSkater(0); paintSkater(0); placeSkater(W.spawn.x, W.spawn.z, W.spawn.yaw);
if (TEST) {
  const res = runTests(), pass = res.filter(r => r.pass).length, box = $('tests');
  box.style.display = 'block';
  box.innerHTML = `<b>SELF-TEST ${pass}/${res.length}</b><br>` + res.map(r => `<div class="${r.pass ? 'p' : 'f'}">${r.pass ? 'PASS' : 'FAIL'} — ${r.name}${r.detail ? ' :: ' + r.detail : ''}</div>`).join('');
  document.title = (pass === res.length ? 'PASS ' : 'FAIL ') + pass + '/' + res.length;
  console.log('[thps self-test]', pass + '/' + res.length, res);
}
showMenu('title');
requestAnimationFrame(frame);
</script>
