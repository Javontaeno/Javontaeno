<canvas id="c" width="960" height="540" tabindex="0"></canvas>
<script>
'use strict';
/* =====================================================================
   LUMEN RUN — a single-file physics platformer.
   Everything (art, sound, music, levels) is generated in code.
   ===================================================================== */

// ---------- core constants ----------
const W = 960, H = 540, T = 32, ROWS = 17;
const GRAV = 2000, MAXFALL = 900, JUMPV = 720, SPRINGV = 1180, RUN = 250;
const MAX_STEP = 1 / 120;          // physics never integrates more than 1/120 s at once
const START_LIVES = 5, MAX_LIVES = 9;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- utilities ----------
function rng(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function fmtTime(s) {
  const m = Math.floor(s / 60), r = s - m * 60;
  return String(m).padStart(2, '0') + ':' + r.toFixed(1).padStart(4, '0');
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
const BOARD_KEY = 'lumenrun.board.v1', NAME_KEY = 'lumenrun.name', MUTE_KEY = 'lumenrun.mute';

const glowCache = new Map();
function glow(color, r) {
  const key = color + r;
  let c = glowCache.get(key);
  if (!c) {
    c = mk(r * 2, r * 2); const g = c.getContext('2d');
    const gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
    glowCache.set(key, c);
  }
  return c;
}

// ---------- audio (all synthesized) ----------
const A = {
  ctx: null, master: null, sfxBus: null, musBus: null, noiseBuf: null,
  muted: store.get(MUTE_KEY, false),
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.55;
      this.master.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = 0.9; this.sfxBus.connect(this.master);
      this.musBus = this.ctx.createGain(); this.musBus.gain.value = 0.55; this.musBus.connect(this.master);
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted; store.set(MUTE_KEY, this.muted);
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.55;
  },
  tone(f, d, type = 'square', v = 0.2, f2 = 0, when = 0, bus) {
    const c = this.ctx; if (!c || this.muted) return;
    const t = c.currentTime + Math.max(0, when);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(bus || this.sfxBus); o.start(t); o.stop(t + d + 0.03);
  },
  noise(d, v = 0.2, freq = 1200, when = 0) {
    const c = this.ctx; if (!c || this.muted) return;
    const t = c.currentTime + when;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = c.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.sfxBus); s.start(t); s.stop(t + d + 0.02);
  }
};
const sfx = {
  jump() { A.tone(280, 0.13, 'square', 0.09, 560); },
  gem() { A.tone(988, 0.07, 'sine', 0.16); A.tone(1480, 0.16, 'sine', 0.14, 0, 0.06); },
  stomp() { A.tone(240, 0.16, 'square', 0.14, 70); A.noise(0.08, 0.12, 2400); },
  hurt() { A.tone(460, 0.4, 'sawtooth', 0.16, 55); A.noise(0.3, 0.18, 900); },
  spring() { A.tone(170, 0.32, 'sine', 0.24, 960); },
  check() { [523, 659, 784, 1047].forEach((f, i) => A.tone(f, 0.16, 'triangle', 0.16, 0, i * 0.07)); },
  crumble() { A.noise(0.25, 0.14, 500); },
  land() { A.noise(0.05, 0.05, 380); },
  shatter() { A.noise(0.18, 0.12, 5000); A.tone(1800, 0.1, 'triangle', 0.05, 900); },
  clear() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => A.tone(f, 0.22, 'square', 0.08, 0, i * 0.1)); },
  over() { [392, 330, 262, 196].forEach((f, i) => A.tone(f, 0.35, 'triangle', 0.18, 0, i * 0.22)); },
  select() { A.tone(660, 0.06, 'square', 0.07); },
  life() { [660, 880, 1320].forEach((f, i) => A.tone(f, 0.12, 'sine', 0.14, 0, i * 0.08)); }
};
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const Music = {
  world: -1, next: 0, step: 0,
  start(w) { this.world = w; this.step = 0; if (A.ctx) this.next = A.ctx.currentTime + 0.1; },
  stop() { this.world = -1; },
  tick() {
    if (!A.ctx || this.world < 0 || A.muted) return;
    const m = WORLDS[this.world].music, spb = 60 / m.bpm / 2, now = A.ctx.currentTime;
    if (this.next < now) this.next = now + 0.05;
    while (this.next < now + 0.2) {
      const s = this.step, root = m.prog[Math.floor(s / 16) % m.prog.length], when = this.next - now;
      if (s % 4 === 0) A.tone(midi(m.base + root), spb * 3.6, m.bass, 0.13, 0, when, A.musBus);
      if (s % 4 === 2) A.tone(midi(m.base + root + 12), spb * 1.6, m.bass, 0.07, 0, when, A.musBus);
      const a = m.arp[s % m.arp.length];
      if (a != null) A.tone(midi(m.base + 24 + root + m.chord[a]), spb * 0.9, m.lead, m.lv, 0, when, A.musBus);
      if (m.hat && s % 2 === 1) A.noise(0.03, 0.025, 7000, when);
      this.next += spb; this.step++;
    }
  }
};

// ---------- input ----------
const keys = Object.create(null), pressed = Object.create(null);
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'KeyZ'];
const isL = () => keys.ArrowLeft || keys.KeyA;
const isR = () => keys.ArrowRight || keys.KeyD;
const isJ = () => keys.Space || keys.ArrowUp || keys.KeyW || keys.KeyZ;
const isD = () => keys.ArrowDown || keys.KeyS;
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
  A.init();
  if (G.state === 'entry') { if (!e.repeat || e.key === 'Backspace') nameKey(e); return; }  // typing owns the keyboard
  if (!e.repeat) {
    pressed[e.code] = true;
    if (JUMP_KEYS.includes(e.code) && G.state === 'play') P.jumpBuf = 0.12;
  }
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G.state === 'play') G.state = 'pause'; });
cv.addEventListener('pointerdown', () => { A.init(); cv.focus(); pressed.Enter = true; });
const hit = (...codes) => codes.some(c => pressed[c]);
const CONFIRM = ['Enter', 'Space', 'NumpadEnter'];

// =====================================================================
// THEMES — per-world tile art
// =====================================================================
const THEMES = {
  meadow: {
    base: '#8b5a2b', dark: '#6a421f', light: '#a36d3b',
    spike: ['#b8c0cc', '#eef2f7'], plat: ['#c9955a', '#8c6134'], mp: ['#d7a868', '#8a5c30'],
    top(g, x, y, r) {
      g.fillStyle = '#3f9f35'; g.fillRect(x, y, T, 9);
      g.fillStyle = '#5ccb4a'; g.fillRect(x, y, T, 6);
      for (let i = 0; i < 6; i++) { g.fillStyle = r() < 0.5 ? '#6fdc59' : '#48b63c'; g.fillRect(x + i * 5 + (r() * 3 | 0), y - 3 - (r() * 2 | 0), 2, 5); }
      if (r() < 0.18) { g.fillStyle = ['#fff', '#ffd84a', '#ff7aa8'][r() * 3 | 0]; g.fillRect(x + 6 + (r() * 18 | 0), y - 6, 4, 4); }
    }
  },
  cave: {
    base: '#3a2c5a', dark: '#271c42', light: '#4b3a73',
    spike: ['#5fe0ff', '#c8f7ff'], plat: ['#7d68b8', '#4a3a78'], mp: ['#8c7bd0', '#4f3f86'],
    top(g, x, y, r) {
      g.fillStyle = '#6e53bd'; g.fillRect(x, y, T, 5);
      g.fillStyle = '#9a82ec'; g.fillRect(x, y, T, 2);
      if (r() < 0.22) {
        const cx = x + 6 + r() * 20, h = 6 + r() * 8;
        g.fillStyle = r() < 0.5 ? '#61e6ff' : '#ff6ad5';
        g.beginPath(); g.moveTo(cx - 3, y + 1); g.lineTo(cx, y - h); g.lineTo(cx + 3, y + 1); g.fill();
      }
    }
  },
  ice: {
    base: '#627791', dark: '#4b5d75', light: '#7c92ad',

    top(g, x, y, r) {
      g.fillStyle = '#f4fbff'; rr(g, x - 1, y - 3, T + 2, 10, 4); g.fill();
      g.fillStyle = '#d6e9f7'; g.fillRect(x, y + 5, T, 2);
      if (r() < 0.4) { g.fillStyle = '#f4fbff'; g.fillRect(x + 4 + (r() * 22 | 0), y + 6, 3, 3 + (r() * 4 | 0)); }

  magma: {

    top(g, x, y, r) {
      g.fillStyle = '#140909'; g.fillRect(x, y, T, 6);
      g.fillStyle = '#ff5d1f'; g.fillRect(x, y + 6, T, 2);
      if (r() < 0.35) { g.fillStyle = '#ffae3a'; g.fillRect(x + (r() * 26 | 0), y + 9, 5, 2); }
    }
  }
};

// =====================================================================
// WORLDS & LEVELS — built in code with a tiny level-builder DSL
// Rows 0..16. "stand row" = row the player's feet rest in.
// Jump envelope: ~3 tiles up, ~4 tiles across. Springs: ~10 tiles up.
// =====================================================================
class LB {
  constructor(w) { this.w = w; this.grid = []; for (let y = 0; y < ROWS; y++) this.grid.push(new Array(w).fill('.')); this.ents = []; }
  set(x, y, c) { if (x >= 0 && x < this.w && y >= 0 && y < ROWS) this.grid[y][x] = c; return this; }
  fill(x0, y0, x1, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) this.set(x, y, c); return this; }
  ground(x0, x1, top, c = '#') { return this.fill(x0, top, x1, ROWS - 1, c); }
  plat(x, y, n) { return this.fill(x, y, x + n - 1, y, '-'); }
  spikes(x, y, n) { return this.fill(x, y, x + n - 1, y, '^'); }
  crumble(x, y, n) { return this.fill(x, y, x + n - 1, y, 'X'); }
  lava(x0, x1, top = 14) { return this.fill(x0, top, x1, ROWS - 1, 'L'); }
  g(x, y, n = 1, dx = 1, dy = 0) { for (let i = 0; i < n; i++) this.ents.push({ type: 'gem', x: x + i * dx, y: y + i * dy }); return this; }
  e(type, x, y, o) { this.ents.push(Object.assign({ type, x, y }, o || {})); return this; }
}

const WORLDS = [

      L.ground(39, 50, 11); L.e('crate', 41, 10);

      L.spikes(62, 11, 2); L.g(62, 9, 2); L.e('walker', 66, 11);
      L.set(70, 11, 'S');                                 // spring over pit 71-74
      L.plat(72, 3, 6); L.g(72, 2, 6);                    // sky bonus shelf
      L.ground(75, 86, 12); L.e('walker', 79, 11); L.e('walker', 84, 11); L.g(80, 9, 3);
      L.ground(87, 90, 10); L.ground(91, 94, 8); L.g(88, 9); L.g(92, 7);
      L.e('mp', 95, 8, { rx: 3, per: 3.2 }); L.g(96, 5, 3);
      L.ground(101, 112, 10); L.g(104, 8, 4); L.e('walker', 108, 9);
      L.ground(113, 129, 12); L.spikes(116, 11, 2); L.g(116, 9, 2); L.e('walker', 121, 11);

  },
  {

const BGW = 1920;

const bgCache = {};
function getBg(theme) {
  if (bgCache[theme]) return bgCache[theme];
  const r = rng(theme.length * 131 + 7), L = [];
  const layer = (f, draw) => { const c = mk(BGW, H); draw(c.getContext('2d')); L.push({ c, f }); };
  if (theme === 'meadow') {
    layer(0.08, g => {
      ridge(g, 330, [[2, 34, 0], [5, 12, 1]], '#a9dcc0');
      g.fillStyle = 'rgba(255,255,255,0.9)';
      for (let i = 0; i < 9; i++) {
        const x = r() * BGW, y = 50 + r() * 120, s = 30 + r() * 30;
        wrapDraw(g, x, xx => { for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(xx + k * s * 0.6, y + (k % 2) * 6, s * 0.6, s * 0.4, 0, 0, 7); g.fill(); } });
      }
    });
    layer(0.25, g => {
      ridge(g, 400, [[3, 36, 2], [7, 10, 0]], '#79c27b');
      for (let i = 0; i < 26; i++) {
        const x = (i + r() * 0.5) * BGW / 26, y = 400 + sines(x, [[3, 36, 2], [7, 10, 0]]);
        g.fillStyle = '#5a9a4e'; g.fillRect(x - 2, y - 26, 4, 28);
        g.fillStyle = '#4f9d4f'; g.beginPath(); g.arc(x, y - 32, 16 + r() * 8, 0, 7); g.fill();
      }
    });

  } else if (theme === 'cave') {
    layer(0.1, g => {
      g.fillStyle = '#1b1232';
      for (let i = 0; i < 40; i++) {
        const x = r() * BGW, w = 20 + r() * 50, h = 60 + r() * 160;
        wrapDraw(g, x, xx => { g.beginPath(); g.moveTo(xx - w, 0); g.lineTo(xx, h); g.lineTo(xx + w, 0); g.fill(); });
        const x2 = r() * BGW, h2 = 40 + r() * 140;
        wrapDraw(g, x2, xx => { g.beginPath(); g.moveTo(xx - w, H); g.lineTo(xx, H - h2); g.lineTo(xx + w, H); g.fill(); });
      }

        g.fillStyle = r() < 0.5 ? 'rgba(97,230,255,0.5)' : 'rgba(255,106,213,0.45)';

    });
    layer(0.3, g => {
      for (let i = 0; i < 14; i++) {
        const x = r() * BGW, w = 40 + r() * 50;

          g.fillStyle = '#261a44'; g.beginPath(); g.moveTo(xx - w, 0); g.lineTo(xx - w * 0.5, H); g.lineTo(xx + w * 0.5, H); g.lineTo(xx + w, 0); g.fill();

        wrapDraw(g, cx, xx => {

// darkness overlay for the caverns: one big prerendered vignette

// =====================================================================
// TILE LAYER — static tiles prerendered once per level
// =====================================================================
const SOLID_CH = c => c === '#' || c === 'I' || c === 'X' || c === 'S';
function renderTiles(lv) {
  const c = mk(lv.w * T, ROWS * T), g = c.getContext('2d'), th = lv.th, r = rng(4242 + lv.i * 77);
  const at = (x, y) => (y < 0) ? '.' : (x < 0 || x >= lv.w || y >= ROWS) ? '#' : lv.grid[y][x];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < lv.w; x++) {
    const ch = lv.grid[y][x], px = x * T, py = y * T;
    if (ch === '#') {
      g.fillStyle = th.base; g.fillRect(px, py, T, T);
      for (let k = 0; k < 5; k++) { g.fillStyle = r() < 0.5 ? th.dark : th.light; g.fillRect(px + (r() * 28 | 0), py + (r() * 28 | 0), 2 + (r() * 4 | 0), 2 + (r() * 3 | 0)); }
      if (lv.wd.theme === 'magma' && r() < 0.12) { g.fillStyle = '#ff5a1f'; g.fillRect(px + (r() * 26 | 0), py + (r() * 26 | 0), 3, 2); }
      g.fillStyle = th.dark;
      if (!SOLID_CH(at(x - 1, y))) g.fillRect(px, py, 3, T);
      if (!SOLID_CH(at(x + 1, y))) g.fillRect(px + T - 3, py, 3, T);
      if (!SOLID_CH(at(x, y + 1))) g.fillRect(px, py + T - 4, T, 4);
      if (!SOLID_CH(at(x, y - 1))) th.top(g, px, py, r);
    } else if (ch === 'I') {
      const gr = g.createLinearGradient(px, py, px, py + T); gr.addColorStop(0, '#c9ecff'); gr.addColorStop(1, '#7cbfe9');
      g.fillStyle = gr; g.fillRect(px, py, T, T);
      g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(px + 4 + r() * 6, py + T - 4); g.lineTo(px + 18 + r() * 8, py + 6); g.stroke();
      g.fillStyle = 'rgba(40,90,140,0.35)'; g.fillRect(px + T - 2, py, 2, T);
      if (!SOLID_CH(at(x, y - 1))) { g.fillStyle = '#f2fbff'; g.fillRect(px, py, T, 4); }
    } else if (ch === '-') {
      g.fillStyle = th.plat[1]; g.fillRect(px + 4, py + 8, 4, 10); g.fillRect(px + T - 8, py + 8, 4, 10);
      g.fillStyle = th.plat[0]; rr(g, px, py, T, 9, 3); g.fill();
      g.fillStyle = th.plat[1]; g.fillRect(px, py + 7, T, 2);

      }
    }
  }

}

// =====================================================================
// GAME STATE
// =====================================================================
const G = {
  state: 'title', t: 0, lvl: 0, lives: START_LIVES, score: 0, runTime: 0, levelTime: 0,
  levelStartScore: 0, gems: 0, gemsTotal: 0, spawn: { x: 0, y: 0 }, respawn: { x: 0, y: 0 },
  cam: { x: 0, y: 0 }, shake: 0, toast: null, cardT: 0, dieT: 0, clear: null, won: false,
  name: store.get(NAME_KEY, ''), boardHi: -1, showFps: /[?&]fps/.test(location.search), reached: 1
};
const P = { x: 0, y: 0, w: 20, h: 28, vx: 0, vy: 0, onGround: false, gtile: '.', coyote: 0, jumpBuf: 0, face: 1, inv: 0, ride: null, onCrate: null, spring: false, sx: 1, sy: 1, hitX: false, hitY: false, blink: 2 };
let LV = null;
const parts = [];
let weather = [];

function tile(x, y) {
  if (x < 0 || x >= LV.w) return '#';
  if (y < 0 || y >= ROWS) return '.';
  return LV.grid[y][x];
}
function solidAt(x, y) {
  const c = tile(x, y);
  if (c === '#' || c === 'I' || c === 'S') return true;
  if (c === 'X') return LV.cmap.get(y * LV.w + x).state < 2;
  return false;
}

function loadLevel(i) {
  const wd = WORLDS[i], d = buildLevel(i);
  LV = {
    i, wd, w: d.w, grid: d.grid, pxW: d.w * T, pxH: ROWS * T, th: THEMES[wd.theme],
    mps: [], crates: [], enemies: [], gems: [], checks: [], exit: null,
    crumbles: [], cmap: new Map(), lava: [], springs: [], smap: new Map()
  };
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < LV.w; x++) {
    const c = LV.grid[y][x];
    if (c === 'X') { const o = { x, y, state: 0, t: 0 }; LV.crumbles.push(o); LV.cmap.set(y * LV.w + x, o); }
    else if (c === 'L') LV.lava.push({ x, y, top: y === 0 || LV.grid[y - 1][x] !== 'L' });
    else if (c === 'S') { const o = { x, y, t: 0 }; LV.springs.push(o); LV.smap.set(y * LV.w + x, o); }
  }
  for (const e of d.ents) {
    const bx = e.x * T, by = (e.y + 1) * T;
    switch (e.type) {
      case 'start': G.spawn = { x: bx + (T - P.w) / 2, y: by - P.h }; break;
      case 'gem': LV.gems.push({ x: bx + 16, y: e.y * T + 16, got: false, ph: e.x * 0.7 }); break;
      case 'walker': LV.enemies.push({ type: 'walker', x: bx + 3, y: by - 22, w: 26, h: 22, vx: 0, vy: 0, dir: -1, spd: wd.espd, stomp: true, dead: false, dt: 0 }); break;
      case 'bat': LV.enemies.push({ type: 'bat', x0: bx + 3, y0: e.y * T + 7, x: bx + 3, y: e.y * T + 7, w: 26, h: 18, r: (e.r || 3) * T, t: e.x * 0.37, sp: 1.1 + (e.x % 3) * 0.2, dir: 1, stomp: true, dead: false, dt: 0 }); break;
      case 'fire': LV.enemies.push({ type: 'fire', x: bx + 6, y0: e.y * T, y: e.y * T + 40, w: 20, h: 20, vy: 0, wait: 0.6 + (e.x % 4) * 0.45, active: false, stomp: false, dead: false, pw: e.pw || 950 }); break;
      case 'icicle': LV.enemies.push({ type: 'icicle', x: bx + 9, y: e.y * T, w: 14, h: 26, state: 0, t: 0, vy: 0, stomp: false, dead: false }); break;
      case 'crate': LV.crates.push({ x: bx + 2, y: by - 28, w: 28, h: 28, vx: 0, vy: 0, ox: bx + 2, oy: by - 28, dx: 0, onGround: false, gtile: '.' }); break;
      case 'mp': LV.mps.push({ x0: bx, y0: e.y * T, x: bx, y: e.y * T, rx: (e.rx || 0) * T, ry: (e.ry || 0) * T, per: e.per || 3, ph: 0, w: 96, h: 14, dx: 0, dy: 0 }); break;
      case 'check': LV.checks.push({ x: bx + 8, y: by - 64, w: 16, h: 64, on: false }); break;
      case 'exit': LV.exit = { x: bx - 4, y: by - 56, w: 40, h: 56 }; break;
    }
  }
  LV.tiles = renderTiles(LV);
  LV.bg = getBg(wd.theme);
  LV.skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  LV.skyGrad.addColorStop(0, wd.sky[0]); LV.skyGrad.addColorStop(1, wd.sky[1]);
  G.respawn = { ...G.spawn };
  G.levelTime = 0; G.gems = 0; G.gemsTotal = LV.gems.length; G.levelStartScore = G.score;
  parts.length = 0; initWeather(wd.weather);
  placePlayer(G.spawn); P.inv = 0;
  snapCam();
}

function placePlayer(p) {
  Object.assign(P, { x: p.x, y: p.y, vx: 0, vy: 0, onGround: false, ride: null, onCrate: null, spring: false, coyote: 0, jumpBuf: 0, sx: 1, sy: 1, face: 1 });
}

function initWeather(kind) {
  weather = []; const r = rng(99);
  const n = kind === 'snow' ? 140 : kind === 'embers' ? 70 : kind === 'motes' ? 50 : 0;
  for (let i = 0; i < n; i++) weather.push({ x: r() * W, y: r() * H, s: 1 + r() * 2.5, sp: 20 + r() * 50, ph: r() * 6 });
}

// ---------- particles ----------
function burst(x, y, n, col, spd = 200, life = 0.6, grav = 600, size = 3) {
  for (let i = 0; i < n && parts.length < 600; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.3, life, max: life, col, grav, size });
  }
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

// =====================================================================
// PHYSICS — axis-separated AABB vs tile grid, fixed small substeps
// =====================================================================
function moveX(b, dx) {
  b.hitX = false; if (!dx) return;
  b.x += dx;
  const y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
  if (dx > 0) {
    const tx = Math.floor((b.x + b.w - 0.01) / T);
    for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { b.x = tx * T - b.w; b.hitX = true; return; }
  } else {
    const tx = Math.floor(b.x / T);
    for (let ty = y0; ty <= y1; ty++) if (solidAt(tx, ty)) { b.x = (tx + 1) * T; b.hitX = true; return; }
  }
}
function moveY(b, dy, drop) {
  b.hitY = false; b.onGround = false; if (!dy) return;
  const pb = b.y + b.h;
  b.y += dy;
  const x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T);
  if (dy > 0) {
    const ty = Math.floor((b.y + b.h - 0.01) / T);
    for (let tx = x0; tx <= x1; tx++) {
      if (solidAt(tx, ty) || (!drop && tile(tx, ty) === '-' && pb <= ty * T + 0.5)) {
        b.y = ty * T - b.h; b.hitY = true; b.onGround = true; return;
      }
    }
  } else {
    const ty = Math.floor(b.y / T);
    for (let tx = x0; tx <= x1; tx++) if (solidAt(tx, ty)) { b.y = (ty + 1) * T; b.hitY = true; return; }
  }
}

function step(h) {
  G.levelTime += h; G.runTime += h;
  for (const m of LV.mps) {
    m.ph += h;
    const k = (1 - Math.cos(m.ph / m.per * Math.PI * 2)) / 2;
    const nx = m.x0 + m.rx * k, ny = m.y0 + m.ry * k;
    m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
  }
  for (const c of LV.crumbles) {
    if (c.state === 1) {
      c.t -= h;
      if (c.t <= 0) { c.state = 2; c.t = 3; sfx.crumble(); burst(c.x * T + 16, c.y * T + 16, 10, LV.th.light, 160, 0.6, 900, 4); }
    } else if (c.state === 2) {
      c.t -= h;
      if (c.t <= 0 && !overlap(P, { x: c.x * T, y: c.y * T, w: T, h: T })) c.state = 0;
    }
  }
  for (const s of LV.springs) if (s.t > 0) s.t -= h;
  updatePlayer(h);
  if (G.state !== 'play') return;
  updateCrates(h);
  updateEnemies(h);
  // pickups & markers
  for (const gm of LV.gems) {
    if (gm.got) continue;
    if (Math.abs(P.x + P.w / 2 - gm.x) < 20 && Math.abs(P.y + P.h / 2 - gm.y) < 22) {
      gm.got = true; G.gems++; G.score += 100; sfx.gem();
      burst(gm.x, gm.y, 10, LV.wd.gem[1], 140, 0.45, 0, 2);
      if (G.gems === G.gemsTotal) { G.lives = Math.min(MAX_LIVES, G.lives + 1); G.score += 1000; sfx.life(); toast('All gems! +1 life  +1000'); }
    }
  }
  for (const c of LV.checks) {
    if (!c.on && overlap(P, c)) {
      for (const o of LV.checks) o.on = false;
      c.on = true; G.respawn = { x: c.x - 2, y: c.y + c.h - P.h };
      sfx.check(); burst(c.x + 8, c.y + 8, 18, '#fff', 180, 0.7, 300, 3); toast('Checkpoint');
    }
  }
  if (LV.exit && overlap(P, LV.exit)) levelClear();
}

function updatePlayer(h) {
  const p = P;
  // carried by moving platform / crate
  if (p.ride) { moveX(p, p.ride.dx); moveY(p, p.ride.dy, true); }
  if (p.onCrate) moveX(p, p.onCrate.dx);

  const dir = (isR() ? 1 : 0) - (isL() ? 1 : 0);
  const grounded = p.onGround || p.ride || p.onCrate;
  const onIce = grounded && p.gtile === 'I';
  const acc = grounded ? (onIce ? 650 : 2600) : 1600;
  const fr = grounded ? (onIce ? 160 : 2600) : 320;
  const max = onIce ? 300 : RUN;
  if (dir) {
    if (dir * p.vx < 0 && !onIce) p.vx += dir * fr * h;       // snappy turnaround off ice
    if (dir * p.vx < max) p.vx = dir > 0 ? Math.min(p.vx + acc * h, max) : Math.max(p.vx - acc * h, -max);
    p.face = dir;
  } else {
    const d = fr * h; p.vx = Math.abs(p.vx) <= d ? 0 : p.vx - Math.sign(p.vx) * d;
  }
  // carried-over speed (e.g. leaving ice) bleeds off instead of snapping
  if (Math.abs(p.vx) > max) p.vx = Math.sign(p.vx) * Math.max(max, Math.abs(p.vx) - 900 * h);

  if (grounded) { p.coyote = 0.1; p.spring = false; } else p.coyote -= h;
  p.jumpBuf -= h;
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = -JUMPV; p.jumpBuf = 0; p.coyote = 0; p.onGround = false; p.ride = null; p.onCrate = null;
    p.sx = 0.72; p.sy = 1.32; sfx.jump();
    burst(p.x + p.w / 2, p.y + p.h, 6, 'rgba(255,255,255,0.8)', 90, 0.3, 200, 2);
  }
  let gm = 1;
  if (p.vy < 0 && !isJ() && !p.spring) gm = 2.6;     // variable jump height
  else if (p.vy > 0) gm = 1.12;
  p.vy = Math.min(p.vy + GRAV * gm * h, MAXFALL);

  const prevBottom = p.y + p.h, prevTop = p.y, prevVy = p.vy, wasGround = grounded;
  moveX(p, p.vx * h);
  if (p.hitX) p.vx = 0;
  // push crates
  for (const c of LV.crates) {
    if (!overlap(p, c) || p.y + p.h <= c.y + 4 || p.y >= c.y + c.h - 4) continue;
    if (p.x + p.w / 2 < c.x + c.w / 2) {
      moveX(c, p.x + p.w - c.x); p.x = c.x - p.w;
      if (p.vx > 0) { c.vx = Math.max(c.vx, p.vx * 0.9); p.vx = Math.min(p.vx, 150); }
    } else {
      moveX(c, -(c.x + c.w - p.x)); p.x = c.x + c.w;
      if (p.vx < 0) { c.vx = Math.min(c.vx, p.vx * 0.9); p.vx = Math.max(p.vx, -150); }
    }
  }
  moveY(p, p.vy * h, isD());
  if (p.hitY) p.vy = 0;
  p.ride = null; p.onCrate = null;
  if (!isD()) for (const m of LV.mps) {
    if (p.vy >= 0 && p.x + p.w > m.x + 2 && p.x < m.x + m.w - 2 && p.y + p.h >= m.y && prevBottom <= Math.max(m.y, m.y - m.dy) + 1) {
      p.y = m.y - p.h; p.vy = 0; p.onGround = true; p.ride = m; p.gtile = '#';
    }
  }
  for (const c of LV.crates) {
    if (p.x + p.w <= c.x + 1 || p.x >= c.x + c.w - 1) continue;
    if (p.vy >= 0 && p.y + p.h > c.y && prevBottom <= c.y + 2) { p.y = c.y - p.h; p.vy = 0; p.onGround = true; p.onCrate = c; p.gtile = '#'; }
    else if (p.vy < 0 && p.y < c.y + c.h && prevTop >= c.y + c.h - 2) { p.y = c.y + c.h; p.vy = 0; }
  }
  if (p.onGround && !p.ride && !p.onCrate) {
    const ty = Math.floor((p.y + p.h + 1) / T), x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + p.w - 0.01) / T);
    let ice = false, spring = null;
    for (let tx = x0; tx <= x1; tx++) {
      const c = tile(tx, ty);
      if (c === 'I') ice = true;
      else if (c === 'S') spring = LV.smap.get(ty * LV.w + tx);
      else if (c === 'X') { const cr = LV.cmap.get(ty * LV.w + tx); if (cr.state === 0) { cr.state = 1; cr.t = 0.45; } }
    }
    p.gtile = ice ? 'I' : '#';
    if (spring) {
      p.vy = -SPRINGV; p.onGround = false; p.spring = true; spring.t = 0.25; p.sx = 0.7; p.sy = 1.4;
      sfx.spring(); burst(p.x + p.w / 2, p.y + p.h, 10, '#fff', 150, 0.4, 300, 2);
    }
  }
  const nowGround = p.onGround || p.ride || p.onCrate;
  if (nowGround && !wasGround && prevVy > 200) {
    p.sx = 1.3; p.sy = 0.75;
    if (prevVy > 500) { sfx.land(); burst(p.x + p.w / 2, p.y + p.h, 5, 'rgba(255,255,255,0.7)', 80, 0.25, 100, 2); }
  }
  // hazards
  const hx0 = p.x + 3, hx1 = p.x + p.w - 3, hy0 = p.y + 4, hy1 = p.y + p.h - 1;
  for (let ty = Math.floor(hy0 / T); ty <= Math.floor(hy1 / T); ty++) for (let tx = Math.floor(hx0 / T); tx <= Math.floor(hx1 / T); tx++) {
    const c = tile(tx, ty);
    if (c === '^' && hy1 > ty * T + 16) hurt();
    else if (c === 'L' && hy1 > ty * T + 10) kill();
  }
  if (p.y > LV.pxH + 40) kill();
  if (p.inv > 0) p.inv -= h;
  G.prevBottom = prevBottom;
}

function updateCrates(h) {
  for (const c of LV.crates) {
    c.vy = Math.min(c.vy + GRAV * h, MAXFALL);
    const ice = c.onGround && c.gtile === 'I';
    const fr = c.onGround ? (ice ? 90 : 1500) : 60, d = fr * h;
    c.vx = Math.abs(c.vx) <= d ? 0 : c.vx - Math.sign(c.vx) * d;
    const ox = c.x;
    moveX(c, c.vx * h); if (c.hitX) c.vx = 0;
    moveY(c, c.vy * h, false); if (c.hitY) c.vy = 0;
    if (c.onGround) c.gtile = tile(Math.floor((c.x + c.w / 2) / T), Math.floor((c.y + c.h + 1) / T));
    c.dx = c.x - ox;
    if (c.y > LV.pxH + 80) { c.x = c.ox; c.y = c.oy; c.vx = c.vy = 0; burst(c.x + 14, c.y + 14, 12, '#fff', 120, 0.5, 0, 2); }
  }
}

function updateEnemies(h) {
  const p = P, pb = G.prevBottom;
  for (const e of LV.enemies) {
    if (e.dead) { e.dt -= h; continue; }
    if (e.type === 'walker') {
      e.vy = Math.min(e.vy + GRAV * h, MAXFALL);
      moveX(e, e.dir * e.spd * h); if (e.hitX) e.dir *= -1;
      moveY(e, e.vy * h, false); if (e.hitY) e.vy = 0;
      if (e.onGround) {
        const fx = e.dir > 0 ? e.x + e.w + 2 : e.x - 2, tx = Math.floor(fx / T), ty = Math.floor((e.y + e.h + 2) / T);
        if (!(solidAt(tx, ty) || tile(tx, ty) === '-') || tile(tx, ty - 1) === '^') e.dir *= -1;
      }
      for (const c of LV.crates) if (overlap(e, c)) { e.dir = e.x < c.x ? -1 : 1; e.x = e.dir < 0 ? c.x - e.w : c.x + c.w; }
      if (e.y > LV.pxH + 64) { e.dead = true; e.dt = 0; }
    } else if (e.type === 'bat') {
      e.t += h;
      const nx = e.x0 + Math.sin(e.t * e.sp) * e.r;
      e.dir = nx >= e.x ? 1 : -1; e.x = nx;
      e.y = e.y0 + Math.sin(e.t * e.sp * 2.3) * 14;
    } else if (e.type === 'fire') {
      if (!e.active) {
        e.wait -= h;
        if (e.wait <= 0) { e.active = true; e.y = e.y0; e.vy = -e.pw; }
      } else {
        e.vy += GRAV * h; e.y += e.vy * h;
        if (Math.random() < 0.5 && parts.length < 600) parts.push({ x: e.x + 10 + (Math.random() - 0.5) * 10, y: e.y + 14, vx: 0, vy: 40, life: 0.35, max: 0.35, col: '#ff8a2a', grav: 0, size: 3 });
        if (e.y > e.y0 + 8 && e.vy > 0) { e.active = false; e.wait = 1.3 + Math.random() * 0.8; e.y = e.y0 + 40; burst(e.x + 10, e.y0, 6, '#ffb23a', 120, 0.4, 500, 3); }
      }
      if (!e.active) continue;
    } else if (e.type === 'icicle') {
      if (e.state === 0) {
        const cx = p.x + p.w / 2;
        if (Math.abs(cx - (e.x + e.w / 2)) < 34 && p.y > e.y) { e.state = 1; e.t = 0.35; }
      } else if (e.state === 1) {
        e.t -= h; if (e.t <= 0) e.state = 2;
      } else if (e.state === 2) {
        e.vy = Math.min(e.vy + GRAV * h, MAXFALL); e.y += e.vy * h;
        if (solidAt(Math.floor((e.x + e.w / 2) / T), Math.floor((e.y + e.h) / T)) || e.y > LV.pxH) {
          e.dead = true; e.dt = 0; sfx.shatter(); burst(e.x + 7, e.y + e.h, 14, '#dff4ff', 180, 0.5, 900, 3); continue;
        }
      }
    }
    // contact with player
    const box = { x: p.x + 2, y: p.y + 2, w: p.w - 4, h: p.h - 2 };
    if (G.state === 'play' && overlap(box, e)) {
      if (e.stomp && p.vy > 0 && pb <= e.y + 10) {
        e.dead = true; e.dt = 0.4; G.score += 200; sfx.stomp();
        p.vy = isJ() ? -640 : -420; p.spring = false; p.sy = 1.25; p.sx = 0.8;
        burst(e.x + e.w / 2, e.y + e.h / 2, 12, LV.wd.enemy[0], 180, 0.5, 700, 3);
      } else hurt();
    }
  }
}

function toast(text) { G.toast = { text, t: 1.8 }; }
function hurt() { if (P.inv > 0) return; kill(); }
function kill() {
  if (G.state !== 'play') return;
  G.lives--; G.state = 'dying'; G.dieT = 1.1; G.shake = 0.35;
  sfx.hurt();
  burst(P.x + P.w / 2, P.y + P.h / 2, 30, '#fff4c2', 260, 0.9, 500, 4);
  burst(P.x + P.w / 2, P.y + P.h / 2, 16, LV.wd.gem[0], 200, 0.8, 300, 3);
}
function respawn() {
  placePlayer(G.respawn); P.inv = 1.5;
  for (const c of LV.crumbles) { c.state = 0; c.t = 0; }
  G.state = 'play'; snapCam();
}
function levelClear() {
  const bonus = Math.max(0, Math.round((LV.wd.par - G.levelTime) * 10)) * 10;
  G.score += bonus;
  const lifeUp = G.lives < MAX_LIVES; if (lifeUp) G.lives++;
  G.clear = { bonus, time: G.levelTime, gems: G.gems, total: G.gemsTotal, lifeUp, t: 0 };
  G.state = 'clear'; Music.stop(); sfx.clear();
  burst(LV.exit.x + 20, LV.exit.y + 28, 40, '#fff', 300, 1, 100, 3);
}

// ---------- run flow ----------
function startRun() {
  G.lives = START_LIVES; G.score = 0; G.runTime = 0; G.lvl = 0; G.won = false; G.reached = 1;
  beginLevel(0);
}
function beginLevel(i) {
  G.lvl = i; G.reached = Math.max(G.reached, i + 1); loadLevel(i);
  G.state = 'card'; G.cardT = 2.4; Music.start(i);
}
function restartLevel() {
  G.score = G.levelStartScore; loadLevel(G.lvl); G.state = 'play'; Music.start(G.lvl);
}
function endRun(won) {
  G.won = won;
  if (won) G.score += G.lives * 500;
  Music.stop();
  G.state = won ? 'victory' : 'gameover';
  if (!won) sfx.over();
}
function board() { const b = store.get(BOARD_KEY, []); return Array.isArray(b) ? b : []; }
function qualifies() { const b = board(); return G.score > 0 && (b.length < 10 || G.score > b[b.length - 1].score); }
function goEntryOrBoard() { G.boardHi = -1; if (qualifies()) G.state = 'entry'; else G.state = 'board'; }
function submitName() {
  const name = (G.name.trim() || 'LUMEN').slice(0, 10);
  store.set(NAME_KEY, name);
  const b = board(), rec = { name, score: G.score, time: G.runTime, world: G.reached, won: G.won, date: Date.now() };
  b.push(rec); b.sort((a, c) => c.score - a.score || a.time - c.time);
  const top = b.slice(0, 10); store.set(BOARD_KEY, top);
  G.boardHi = top.indexOf(rec); G.state = 'board'; sfx.check();
}
function nameKey(e) {
  if (e.key === 'Backspace') { G.name = G.name.slice(0, -1); e.preventDefault(); }
  else if (e.key === 'Enter') submitName();
  else if (e.key === 'Escape') { G.state = 'board'; }
  else if (e.key.length === 1 && /[A-Za-z0-9 _.\-]/.test(e.key) && G.name.length < 10) { G.name += e.key.toUpperCase(); sfx.select(); }
}

// ---------- camera ----------
function snapCam() {
  G.cam.x = clamp(P.x - W * 0.4, 0, LV.pxW - W);
  G.cam.y = clamp(P.y - H * 0.55, 0, LV.pxH - H);
}
function updateCam(dt) {
  const tx = clamp(P.x + P.w / 2 - W * 0.42 + P.vx * 0.25, 0, LV.pxW - W);
  const ty = clamp(P.y - H * 0.55, 0, LV.pxH - H);
  const k = 1 - Math.exp(-dt * 6);
  G.cam.x = lerp(G.cam.x, tx, k); G.cam.y = lerp(G.cam.y, ty, k);
}

// =====================================================================
// UPDATE
// =====================================================================
function update(dt) {
  G.t += dt;
  Music.tick();
  if (hit('KeyM')) A.toggle();
  if (hit('KeyF')) G.showFps = !G.showFps;
  if (G.toast) { G.toast.t -= dt; if (G.toast.t <= 0) G.toast = null; }
  if (G.shake > 0) G.shake -= dt;
  switch (G.state) {
    case 'title':
      if (hit(...CONFIRM)) { sfx.select(); startRun(); }
      else if (hit('KeyL')) { G.boardHi = -1; G.state = 'board'; }
      break;
    case 'card':
      G.cardT -= dt; worldTick(dt, false);
      if (G.cardT <= 0 || hit(...CONFIRM)) G.state = 'play';
      break;
    case 'play': {
      if (hit('KeyP', 'Escape')) { G.state = 'pause'; break; }
      const n = Math.ceil(dt / MAX_STEP), h = dt / n;
      for (let i = 0; i < n && G.state === 'play'; i++) step(h);
      worldTick(dt, true);
      break;
    }
    case 'dying':
      G.dieT -= dt; worldTick(dt, false);
      if (G.dieT <= 0) { if (G.lives > 0) respawn(); else endRun(false); }
      break;
    case 'pause':
      if (hit('KeyP', 'Escape')) G.state = 'play';
      else if (hit('KeyR')) restartLevel();
      else if (hit('KeyQ')) { Music.start(0); G.state = 'title'; }
      break;
    case 'clear':
      G.clear.t += dt; worldTick(dt, false);
      if (G.clear.t > 0.8 && hit(...CONFIRM)) {
        if (G.lvl + 1 < WORLDS.length) beginLevel(G.lvl + 1); else endRun(true);
      }
      break;
    case 'gameover': case 'victory':
      updateParts(dt);
      if (G.won && Math.random() < 0.25) burst(Math.random() * W, Math.random() * H * 0.6, 14, ['#ffd84a', '#ff5a8a', '#5fe7ff', '#fff'][Math.random() * 4 | 0], 200, 1, 200, 3);
      if (hit(...CONFIRM)) goEntryOrBoard();
      break;
    case 'entry': break;
    case 'board':
      if (hit(...CONFIRM, 'Escape')) { parts.length = 0; Music.start(0); G.state = 'title'; }
      break;
  }
}
// animation that runs outside physics (camera, particles, weather, squash)
function worldTick(dt, cam) {
  if (cam || G.state === 'card') updateCam(dt);
  updateParts(dt);
  P.sx = lerp(P.sx, 1, 1 - Math.exp(-dt * 14)); P.sy = lerp(P.sy, 1, 1 - Math.exp(-dt * 14));
  if (G.state === 'dying') { for (const m of LV.mps) { m.ph += dt; const k = (1 - Math.cos(m.ph / m.per * Math.PI * 2)) / 2; m.x = m.x0 + m.rx * k; m.y = m.y0 + m.ry * k; } }
  const kind = LV && LV.wd.weather;
  for (const f of weather) {
    if (kind === 'snow') { f.y += f.sp * dt; f.x += Math.sin(G.t + f.ph) * 20 * dt - 15 * dt; }
    else if (kind === 'embers') { f.y -= f.sp * dt; f.x += Math.sin(G.t * 2 + f.ph) * 30 * dt; }
    else { f.y += Math.sin(G.t + f.ph) * 8 * dt; f.x += Math.cos(G.t * 0.7 + f.ph) * 8 * dt; }
    if (f.y > H + 5) f.y = -5; if (f.y < -5) f.y = H + 5;
  }
}

// =====================================================================
// RENDER
// =====================================================================
function txt(s, x, y, size, col = '#fff', align = 'center', weight = 800) {
  ctx.font = `${weight} ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(s, x + 2, y + 3);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function heart(x, y, s, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3); ctx.fill();
}
function panel(x, y, w, h, a = 0.72) {
  ctx.fillStyle = `rgba(8,6,20,${a})`; rr(ctx, x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2; ctx.stroke();
}

function drawBg(bg, sky, camx, camy) {
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  for (const l of bg) {
    let off = -((camx * l.f) % BGW); if (off > 0) off -= BGW;
    const oy = -camy * l.f * 0.5;
    ctx.drawImage(l.c, off, oy);
    if (off + BGW < W) ctx.drawImage(l.c, off + BGW, oy);
  }
}

function render() {
  if (G.state === 'title' || ((G.state === 'board' || G.state === 'entry' || G.state === 'gameover' || G.state === 'victory') && !LV)) { renderTitleBg(); }
  else if (LV) renderWorld();
  switch (G.state) {
    case 'title': renderTitle(); break;
    case 'card': renderHud(); renderCard(); break;
    case 'play': case 'dying': renderHud(); break;
    case 'pause': renderHud(); renderPause(); break;
    case 'clear': renderHud(); renderClear(); break;
    case 'gameover': renderEnd(false); break;
    case 'victory': renderEnd(true); break;
    case 'entry': renderEntry(); break;
    case 'board': renderBoard(); break;
  }
  if (G.showFps) renderFps();
}

let titleCam = 0;
function renderTitleBg() {
  titleCam += 40 / 60;
  const bg = getBg('meadow');
  if (!renderTitleBg.sky) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5db4ee'); g.addColorStop(1, '#d5f2ff'); renderTitleBg.sky = g; }
  drawBg(bg, renderTitleBg.sky, titleCam * 3, 0);
  ctx.fillStyle = '#3f9f35'; ctx.fillRect(0, 470, W, 70);
  ctx.fillStyle = '#5ccb4a'; ctx.fillRect(0, 470, W, 8);
  ctx.fillStyle = '#6a421f'; ctx.fillRect(0, 490, W, 50);
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
}

function renderWorld() {
  const wd = LV.wd;
  let sx = 0, sy = 0;
  if (G.shake > 0) { sx = (Math.random() - 0.5) * 10 * G.shake / 0.35; sy = (Math.random() - 0.5) * 10 * G.shake / 0.35; }
  const cx = Math.round(G.cam.x + sx), cy = Math.round(G.cam.y + sy);
  drawBg(LV.bg, LV.skyGrad, G.cam.x, G.cam.y);
  if (wd.theme === 'magma') {
    if (!LV.heat) { LV.heat = ctx.createLinearGradient(0, H * 0.5, 0, H); LV.heat.addColorStop(0, 'rgba(255,80,20,0)'); LV.heat.addColorStop(1, 'rgba(255,80,20,0.35)'); }
    ctx.fillStyle = LV.heat; ctx.fillRect(0, H * 0.5, W, H * 0.5);
  }
  // static tiles: one blit of the visible window
  const sw = Math.min(W, LV.pxW - cx), shh = Math.min(H, LV.pxH - cy);
  ctx.drawImage(LV.tiles, cx, cy, sw, shh, 0, 0, sw, shh);
  ctx.save(); ctx.translate(-cx, -cy);
  const x0 = cx - 64, x1 = cx + W + 64, t = G.t;

  // lava

    const px = l.x * T, py = l.y * T; if (px < x0 || px > x1) continue;
    ctx.fillStyle = l.top ? '#ff5a14' : '#c8330b'; ctx.fillRect(px, py, T, T);
    if (l.top) {
      ctx.fillStyle = '#ffb23a';
      ctx.beginPath(); ctx.moveTo(px, py + 10);
      for (let i = 0; i <= T; i += 8) ctx.lineTo(px + i, py + 4 + Math.sin((px + i) / 14 + t * 3) * 3);
      ctx.lineTo(px + T, py + 10); ctx.fill();
    }
  }
  // crumble blocks
  for (const c of LV.crumbles) {
    const px = c.x * T, py = c.y * T; if (px < x0 || px > x1) continue;
    if (c.state === 2) { ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.setLineDash([4, 4]); ctx.strokeRect(px + 2, py + 2, T - 4, T - 4); ctx.setLineDash([]); continue; }
    const o = c.state === 1 ? (Math.random() - 0.5) * 4 : 0;
    ctx.fillStyle = LV.th.light; ctx.fillRect(px + o, py, T, T);
    ctx.fillStyle = LV.th.dark; ctx.fillRect(px + o, py + T - 5, T, 5);
    ctx.strokeStyle = LV.th.dark; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(px + o + 6, py + 2); ctx.lineTo(px + o + 14, py + 14); ctx.lineTo(px + o + 10, py + 26);
    ctx.moveTo(px + o + 14, py + 14); ctx.lineTo(px + o + 26, py + 10); ctx.stroke();
  }
  // springs
  for (const s of LV.springs) {
    const px = s.x * T, py = s.y * T; if (px < x0 || px > x1) continue;
    const k = s.t > 0 ? s.t / 0.25 : 0, top = py + 4 - k * 10;
    ctx.fillStyle = '#555c6b'; ctx.fillRect(px + 2, py + T - 8, T - 4, 8);
    ctx.strokeStyle = '#c9ced8'; ctx.lineWidth = 3; ctx.beginPath();
    const coilTop = top + 6, coilBot = py + T - 8;
    for (let i = 0; i <= 4; i++) ctx.lineTo(px + (i % 2 ? 24 : 8), lerp(coilTop, coilBot, i / 4));
    ctx.stroke();
    ctx.fillStyle = '#ff4d4d'; rr(ctx, px + 1, top, T - 2, 7, 3); ctx.fill();
  }
  // moving platforms
  for (const m of LV.mps) {
    if (m.x + m.w < x0 || m.x > x1) continue;
    ctx.fillStyle = LV.th.mp[1]; rr(ctx, m.x, m.y + 3, m.w, m.h, 5); ctx.fill();
    ctx.fillStyle = LV.th.mp[0]; rr(ctx, m.x, m.y, m.w, m.h - 3, 5); ctx.fill();
    ctx.fillStyle = LV.th.mp[1]; for (let i = 0; i < 3; i++) ctx.fillRect(m.x + 14 + i * 32, m.y + 4, 4, 4);
  }
  // checkpoints
  for (const c of LV.checks) {
    if (c.x < x0 || c.x > x1) continue;
    ctx.fillStyle = '#d9dde6'; ctx.fillRect(c.x + 6, c.y, 4, c.h);
    ctx.fillStyle = c.on ? wd.gem[0] : '#7a7f8c';
    const wv = Math.sin(t * 6) * 3;
    ctx.beginPath(); ctx.moveTo(c.x + 10, c.y + 2); ctx.lineTo(c.x + 36, c.y + 10 + wv); ctx.lineTo(c.x + 10, c.y + 22); ctx.fill();
    if (c.on) { ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(glow('rgba(255,255,255,0.35)', 40), c.x - 22, c.y - 20); ctx.globalCompositeOperation = 'source-over'; }
  }
  // exit portal
  if (LV.exit) {
    const e = LV.exit, ex = e.x + e.w / 2, ey = e.y + e.h / 2;
    ctx.fillStyle = 'rgba(20,10,40,0.85)'; ctx.beginPath(); ctx.ellipse(ex, ey, 18, 27, 0, 0, 7); ctx.fill();
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = i === 1 ? wd.gem[1] : wd.gem[0];
      ctx.beginPath(); ctx.ellipse(ex, ey, 20 - i * 5 + Math.sin(t * 4 + i) * 2, 29 - i * 7, 0, t * (1 + i) % 7, t * (1 + i) % 7 + 4.5); ctx.stroke();
    }
  }
  // crates
  for (const c of LV.crates) {
    if (c.x < x0 || c.x > x1) continue;
    ctx.fillStyle = '#9c6a35'; ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.strokeStyle = '#5e3c18'; ctx.lineWidth = 3; ctx.strokeRect(c.x + 1.5, c.y + 1.5, c.w - 3, c.h - 3);
    ctx.beginPath(); ctx.moveTo(c.x + 3, c.y + 3); ctx.lineTo(c.x + c.w - 3, c.y + c.h - 3); ctx.moveTo(c.x + c.w - 3, c.y + 3); ctx.lineTo(c.x + 3, c.y + c.h - 3); ctx.stroke();
  }
  // gems
  for (const g of LV.gems) {
    if (g.got || g.x < x0 || g.x > x1) continue;
    const y = g.y + Math.sin(t * 3 + g.ph) * 3;
    ctx.fillStyle = wd.gem[0];
    ctx.beginPath(); ctx.moveTo(g.x, y - 10); ctx.lineTo(g.x + 8, y); ctx.lineTo(g.x, y + 10); ctx.lineTo(g.x - 8, y); ctx.fill();
    ctx.fillStyle = wd.gem[1];
    ctx.beginPath(); ctx.moveTo(g.x, y - 10); ctx.lineTo(g.x + 3, y - 1); ctx.lineTo(g.x - 5, y); ctx.fill();
  }
  // enemies
  for (const e of LV.enemies) {
    if (e.x + e.w < x0 || e.x > x1) continue;
    drawEnemy(e, t);
  }
  // player
  if (G.state !== 'dying' && G.state !== 'clear') drawPlayer(t);
  // particles
  for (const p of parts) {
    if (p.x < x0 || p.x > x1) continue;
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // lighting & weather (screen space)
  if (wd.dark) {
    const px = P.x + P.w / 2 - cx, py = P.y + P.h / 2 - cy;
    ctx.drawImage(darkness, Math.round(px - W), Math.round(py - H));
    // glowing things punch through the dark
    ctx.globalCompositeOperation = 'lighter';
    for (const g of LV.gems) if (!g.got && g.x > x0 && g.x < x1) ctx.drawImage(glow('rgba(95,231,255,0.45)', 26), g.x - cx - 26, g.y - cy - 26);
    if (LV.exit) ctx.drawImage(glow('rgba(160,120,255,0.6)', 70), LV.exit.x + 20 - cx - 70, LV.exit.y + 28 - cy - 70);
    for (const c of LV.checks) if (c.x > x0 && c.x < x1) ctx.drawImage(glow('rgba(255,255,255,0.25)', 40), c.x - cx - 32, c.y - cy - 20);
    for (const e of LV.enemies) if (!e.dead && e.x > x0 && e.x < x1) ctx.drawImage(glow('rgba(190,120,255,0.3)', 22), e.x + e.w / 2 - cx - 22, e.y + e.h / 2 - cy - 22);
    ctx.globalCompositeOperation = 'source-over';
  } else {
    ctx.globalCompositeOperation = 'lighter';
    if (LV.exit) ctx.drawImage(glow('rgba(255,255,255,0.35)', 60), LV.exit.x + 20 - cx - 60, LV.exit.y + 28 - cy - 60);
    if (wd.theme === 'magma') {
      const lg = glow('rgba(255,110,30,0.28)', 40);
      for (const l of LV.lava) { if (!l.top) continue; const px = l.x * T - cx; if (px < -64 || px > W + 32) continue; ctx.drawImage(lg, px - 24, l.y * T - cy - 40); }
      for (const e of LV.enemies) if (e.type === 'fire' && e.active) ctx.drawImage(glow('rgba(255,160,40,0.6)', 30), e.x + 10 - cx - 30, e.y + 10 - cy - 30);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  const kind = wd.weather;
  if (kind) {
    ctx.fillStyle = kind === 'snow' ? 'rgba(255,255,255,0.85)' : kind === 'embers' ? 'rgba(255,140,50,0.85)' : 'rgba(150,230,255,0.6)';
    for (const f of weather) {
      const x = ((f.x - G.cam.x * 0.3 * (f.s / 3)) % W + W) % W;
      ctx.fillRect(x, f.y, f.s, f.s);
    }
  }
}

function drawPlayer(t) {
  const p = P;
  if (p.inv > 0 && ((t * 16) | 0) % 2 === 0) return;
  const cx = p.x + p.w / 2, by = p.y + p.h;
  const w = (p.w + 4) * p.sx, h = p.h * p.sy;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(glow('rgba(255,230,150,0.35)', 44), cx - 44, by - h / 2 - 44);
  ctx.globalCompositeOperation = 'source-over';
  // scarf
  const sw = Math.sin(t * 14) * 3, trail = -p.face * (8 + Math.min(14, Math.abs(p.vx) / 18));
  ctx.fillStyle = LV.wd.gem[0];
  ctx.beginPath(); ctx.moveTo(cx - p.face * 4, by - h + 13); ctx.lineTo(cx + trail, by - h + 10 + sw); ctx.lineTo(cx + trail * 0.9, by - h + 17 + sw); ctx.lineTo(cx - p.face * 4, by - h + 19); ctx.fill();
  ctx.fillStyle = '#fff6cf'; rr(ctx, cx - w / 2, by - h, w, h, 9); ctx.fill();
  ctx.fillStyle = '#ffd35a'; rr(ctx, cx - w / 2, by - h * 0.45, w, h * 0.45, 7); ctx.fill();
  // eyes
  p.blink -= 1 / 60; const bl = p.blink < 0.12; if (p.blink < 0) p.blink = 2 + Math.random() * 3;
  ctx.fillStyle = '#2a2140';
  const ex = cx + p.face * 3, ey = by - h + 9;
  ctx.fillRect(ex - 5, ey + (bl ? 3 : 0), 3, bl ? 1 : 6);
  ctx.fillRect(ex + 3, ey + (bl ? 3 : 0), 3, bl ? 1 : 6);
}

function drawEnemy(e, t) {
  const wd = LV.wd;
  if (e.type === 'walker') {
    if (e.dead) {
      if (e.dt <= 0) return;
      ctx.globalAlpha = e.dt / 0.4; ctx.fillStyle = wd.enemy[0]; rr(ctx, e.x, e.y + e.h - 8, e.w, 8, 4); ctx.fill(); ctx.globalAlpha = 1; return;
    }
    const step = Math.sin(t * 14 + e.x * 0.1) * 2;
    ctx.fillStyle = wd.enemy[1]; ctx.fillRect(e.x + 4, e.y + e.h - 5 + step, 6, 5); ctx.fillRect(e.x + e.w - 10, e.y + e.h - 5 - step, 6, 5);
    ctx.fillStyle = wd.enemy[0]; rr(ctx, e.x, e.y, e.w, e.h - 3, 10); ctx.fill();
    if (wd.theme === 'magma') { ctx.strokeStyle = '#ff6a1f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(e.x + 6, e.y + 4); ctx.lineTo(e.x + 12, e.y + 12); ctx.lineTo(e.x + 20, e.y + 8); ctx.stroke(); }
    if (wd.theme === 'ice') { ctx.fillStyle = '#e8f4ff'; rr(ctx, e.x + 6, e.y + 8, e.w - 12, e.h - 12, 6); ctx.fill(); }
    const ex = e.x + e.w / 2 + e.dir * 5;
    ctx.fillStyle = '#fff'; ctx.fillRect(ex - 7, e.y + 4, 6, 7); ctx.fillRect(ex + 1, e.y + 4, 6, 7);
    ctx.fillStyle = '#111'; ctx.fillRect(ex - 5 + e.dir * 1.5, e.y + 6, 3, 4); ctx.fillRect(ex + 3 + e.dir * 1.5, e.y + 6, 3, 4);
  } else if (e.type === 'bat') {
    if (e.dead) return;
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2, f = Math.sin(t * 18 + e.x0) * 8;
    ctx.fillStyle = wd.enemy[1];
    ctx.beginPath(); ctx.moveTo(cx - 4, cy); ctx.lineTo(cx - 17, cy - 4 - f); ctx.lineTo(cx - 10, cy + 5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + 17, cy - 4 - f); ctx.lineTo(cx + 10, cy + 5); ctx.fill();
    ctx.fillStyle = wd.enemy[0]; ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffe14a'; ctx.fillRect(cx - 4 + e.dir, cy - 3, 3, 3); ctx.fillRect(cx + 1 + e.dir, cy - 3, 3, 3);
  } else if (e.type === 'fire') {
    if (!e.active) return;
    const cx = e.x + 10, cy = e.y + 10;
    ctx.fillStyle = '#ff4d12'; ctx.beginPath(); ctx.arc(cx, cy, 11, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffb23a'; ctx.beginPath(); ctx.arc(cx, cy - 1, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(cx, cy - 2, 3, 0, 7); ctx.fill();
  } else if (e.type === 'icicle') {
    if (e.dead) return;
    const o = e.state === 1 ? (Math.random() - 0.5) * 3 : 0;
    ctx.fillStyle = '#bfe6ff'; ctx.beginPath(); ctx.moveTo(e.x + o, e.y); ctx.lineTo(e.x + e.w + o, e.y); ctx.lineTo(e.x + e.w / 2 + o, e.y + e.h); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(e.x + 3 + o, e.y); ctx.lineTo(e.x + 7 + o, e.y); ctx.lineTo(e.x + e.w / 2 + o, e.y + e.h - 4); ctx.fill();
  }
}

// ---------- frame timing ----------
const perf = { ft: new Float32Array(120), wt: new Float32Array(120), i: 0 };
function renderFps() {
  let f = 0, w = 0, wmax = 0; for (let i = 0; i < 120; i++) { f += perf.ft[i]; w += perf.wt[i]; wmax = Math.max(wmax, perf.wt[i]); }
  f /= 120; w /= 120;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(10, H - 34, 330, 24);
  txt(`${(1000 / f).toFixed(0)} fps · work ${w.toFixed(2)} ms avg · ${wmax.toFixed(2)} max`, 18, H - 22, 13, '#7dff9a', 'left', 700);
}

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1; if (dt <= 0) dt = 1 / 60;
  const t0 = performance.now();
  update(dt); render();
  for (const k in pressed) delete pressed[k];
  perf.ft[perf.i] = dt * 1000; perf.wt[perf.i] = performance.now() - t0; perf.i = (perf.i + 1) % 120;
  requestAnimationFrame(frame);
}
Music.start(0);
requestAnimationFrame(frame);
